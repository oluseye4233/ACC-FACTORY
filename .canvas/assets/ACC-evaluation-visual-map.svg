<text x="750" y="1099" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#344655" font-weight="400">XVL contract checks apply only where supported.</text>
<text x="750" y="1130" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#344655" font-weight="400">Internal PASS ≠ independent PASS ≠ release approval.</text>
<text x="750" y="1161" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#344655" font-weight="400">Missing evidence stays NOT RUN / INCONCLUSIVE.</text>
<text x="750" y="1192" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#344655" font-weight="400">Software and Agent Creator follow eligible route rules.</text>
<rect x="64" y="1270" width="1306" height="153" rx="14" fill="#edf5ff" stroke="#9cb8d7"/>
<text x="86" y="1306" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1756a9" font-weight="700">REMEDIATION LOOP</text>
<text x="86" y="1340" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#344655" font-weight="400">Low score / failed check → exact artifact + findings → Boomerang / SPC Player → corrected revision</text>
<text x="86" y="1374" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#344655" font-weight="400">Score-driven rework → F1 re-ingestion → re-evaluation → eligible return / continuation</text>
<text x="86" y="1403" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#344655" font-weight="400">Upgraded 1, Upgraded 2… retain lineage; a new name or return action does not clear a failed gate.</text>
<text x="64" y="1472" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#176346" font-weight="700">INTERNAL SERVICES</text>
<text x="64" y="1505" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#344655" font-weight="400">Agent Creator: score + governance eligibility. IMPRIMA: editorial checks where run; publication controls remain separate.</text>
<text x="64" y="1538" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344655" font-weight="400">This map documents existing checks. It adds no gates, changes no entitlements and makes no runtime-safety guarantee.</text>
</svg>