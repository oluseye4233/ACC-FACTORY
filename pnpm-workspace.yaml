  lightningcss>lightningcss-win32-arm64-msvc: '-'
  lightningcss>lightningcss-win32-x64-msvc: '-'
  proxy-addr: ^2.0.8
  # Patched transitive releases, restricted to compatible dependency lines.
  form-data@^4: ^4.0.6
  protobufjs@^7: ^7.6.5
  '@babel/core@^7': ^7.29.6
  fast-uri@^3: ^3.1.8
  browserslist@^4: ^4.28.7
  '@xmldom/xmldom@^0.8': ^0.8.15
  baseline-browser-mapping@^2: ^2.11.0
