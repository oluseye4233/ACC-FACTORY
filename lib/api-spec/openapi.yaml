openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ATANDA Command Centre + HARNESS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: me
  - name: sessions
  - name: artifacts
  - name: harness
  - name: billing
  - name: pricing
  - name: admin
  - name: cron
  - name: verify
  - name: exemplars
  - name: prompts
  - name: badges
  - name: export

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Basic liveness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health:
    get:
      operationId: healthDeep
      tags: [health]
      summary: Deep health (db + engines)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeepHealth" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current authenticated user + subscriber
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/usage:
    get:
      operationId: getMyUsage
      tags: [me]
      summary: Token + cost usage for the calling user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [me]
      summary: Update the calling user's display name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/export:
    get:
      operationId: exportMyData
      tags: [me]
      summary: Download a JSON bundle of all of the user's account data (GDPR portability)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDataExport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/delete:
    post:
      operationId: deleteMyAccount
      tags: [me]
      summary: Permanently delete the calling user's account and all associated data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountInput" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteAccountResult" }
        "400":
          description: Confirmation phrase missing or incorrect
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessSession" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
    delete:
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Deleted

  /me/context-craft-badges:
    get:
      operationId: listMyContextCraftBadges
      tags: [me]
      summary: List the 7 Context Craft pillar mini-quest badges (earned + locked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContextCraftBadge" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}/ingestion:
    get:
      operationId: getSessionIngestion
      tags: [sessions]
      summary: Get the ingestion record linked to this session (404 if origin=manual)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}:
    get:
      operationId: getIngestion
      tags: [sessions]
      summary: Fetch a previously-ingested document by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}/start-session:
    post:
      operationId: startSessionFromIngestion
      tags: [sessions]
      summary: Create a HARNESS session seeded from an ingested document
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestStartSessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/feature-state:
    get:
      operationId: listFeatureState
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureState" }

  /sessions/{id}/artifacts:
    get:
      operationId: listSessionArtifacts
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessArtifact" }

  /artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/f1:
    post:
      operationId: harnessF1
      tags: [harness]
      summary: ATLAS Prompt Diagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF1Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptDiagnostic" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /harness/f2:
    post:
      operationId: harnessF2
      tags: [harness]
      summary: Atomic Prompt Builder certification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF2Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtomicPrompt" }

  /harness/f3:
    post:
      operationId: harnessF3Stream
      tags: [harness]
      summary: CELL MA Builder (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF3Input" }
      responses:
        "200":
          description: text/event-stream of MA cultivation events
          content:
            text/event-stream:
              schema: { type: string }

  /harness/f4:
    post:
      operationId: harnessF4
      tags: [harness]
      summary: Micro PDD converter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF4Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroPdd" }

  /harness/f5:
    post:
      operationId: harnessF5
      tags: [harness]
      summary: SPC Builder (FORGE Q&A turn)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF5Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F5StepOutcome" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f6:
    post:
      operationId: harnessF6
      tags: [harness]
      summary: ATLAS PDD Drafter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF6Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtlasPdd" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f6-vdj:
    post:
      operationId: harnessF6Vdj
      tags: [harness]
      summary: VIBE DJ recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF6VdjInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VdjRecommendation" }
        "403":
          description: Tier insufficient (requires Practitioner+)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /harness/f7:
    post:
      operationId: harnessF7Stream
      tags: [harness]
      summary: SPARTAN Compressor (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF7Input" }
      responses:
        "200":
          description: text/event-stream of SPARTAN 7-step events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f8:
    post:
      operationId: harnessF8
      tags: [harness]
      summary: Code DJ — scaffold a codebase from a certified MVP PDD (Architect tier)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF8Input" }
      responses:
        "200":
          description: Codebase bundle scaffolded from the source MVP PDD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodebaseBundle" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/escalations/stream:
    get:
      operationId: harnessEscalationsStream
      tags: [harness]
      summary: SSE feed of escalations for a session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /billing/checkout:
    post:
      operationId: billingCheckout
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }

  /billing/ingestion/checkout:
    post:
      operationId: billingIngestionCheckout
      tags: [billing]
      summary: One-time Stripe checkout for a single ingestion project credit
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestionCheckoutInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "503":
          description: Billing not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /ingestion-credits:
    get:
      operationId: getIngestionCredits
      tags: [billing]
      summary: Available + consumed ingestion credit balance for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionCreditsSummary" }

  /billing/cartridge/checkout:
    post:
      operationId: billingCartridgeCheckout
      tags: [billing]
      summary: One-time Stripe checkout for a single Advanced Cartridge credit
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartridgeCheckoutInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "503":
          description: Billing not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /cartridge-credits:
    get:
      operationId: getCartridgeCredits
      tags: [billing]
      summary: Available + consumed cartridge credit balance for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartridgeCreditsSummary" }

  /cartridge:
    post:
      operationId: createCartridge
      tags: [sessions]
      summary: |
        Create a cartridge package (multi-document + SPCs + optional links).
        Atomically claims one available cartridge credit. Scope statement is
        mandatory and validated server-side (code SCOPE_REQUIRED).
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartridgePackage" }
        "400":
          description: Scope validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "402":
          description: Payment required — no cartridge credit available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /cartridge/{id}:
    get:
      operationId: getCartridge
      tags: [sessions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartridgePackage" }
        "404":
          $ref: "#/components/responses/NotFound"

  /cartridge/{id}/start-session:
    post:
      operationId: startSessionFromCartridge
      tags: [sessions]
      summary: Create a HARNESS session bound to a cartridge package (origin=cartridge)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartridgeStartSessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/cartridge:
    get:
      operationId: getSessionCartridge
      tags: [sessions]
      summary: Get the cartridge bound to this session (404 if not a cartridge session)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartridgePackage" }
        "404":
          $ref: "#/components/responses/NotFound"

  /billing/portal:
    post:
      operationId: billingPortal
      tags: [billing]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSession" }

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook receiver (raw body)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StripeWebhookPayload" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /pricing:
    get:
      operationId: getPricing
      tags: [pricing]
      summary: Public pricing content
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPayload" }

  /admin/pricing:
    put:
      operationId: putPricing
      tags: [admin]
      summary: Replace pricing payload (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingPayload" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPayload" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /cron/reset-harness-limits:
    post:
      operationId: cronResetHarnessLimits
      tags: [cron]
      summary: Reset daily harness counters (requires CRON_SECRET header)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exemplars:
    get:
      operationId: listExemplars
      tags: [exemplars]
      summary: List canonical and hand-authored SPC / PDD exemplars
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExemplarSummary" }

  /exemplars/{id}:
    get:
      operationId: getExemplar
      tags: [exemplars]
      summary: Fetch a single exemplar including its full markdown body
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exemplar" }
        "404":
          $ref: "#/components/responses/NotFound"

  /me/prompts:
    get:
      operationId: listMyPrompts
      tags: [prompts]
      summary: Paginated personal prompt library (atomic prompts, diagnostics, SPCs)
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [ATOMIC_PROMPT, PROMPT_DIAGNOSTIC, SPC] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptLibraryPage" }

  /me/spcs/export.csv:
    get:
      operationId: exportMySpcsCsv
      tags: [export]
      summary: Download all of the user's SPCs in 33-column BI_SPC_ALPHA CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /me/spcs/export.pdf:
    get:
      operationId: exportMySpcsPdf
      tags: [export]
      summary: Download all of the user's SPCs as a printable PDF report
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /me/badges:
    get:
      operationId: listMyBadges
      tags: [badges]
      summary: Compute current Quest Badge progress (ASPE / AISA / AISE)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BadgeProgress" }

  /me/badges/aise/claim:
    post:
      operationId: claimAiseBadge
      tags: [badges]
      summary: Submit URL evidence for AISE (verified against domain allowlist + reachability)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiseClaimInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BadgeProgress" }
        "422":
          description: No verifiable evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/badges/engineer:
    post:
      operationId: claimEngineerBadge
      tags: [badges]
      summary: Submit a live build URL for the Advanced Atomic Intelligent Systems Engineer badge (SSRF-verified)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineerClaimInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BadgeProgress" }
        "422":
          description: URL not reachable or failed SSRF guard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/badges/revoke:
    post:
      operationId: adminRevokeBadge
      tags: [admin]
      summary: Revoke a user's AISE or AISE_BUILD badge (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRevokeBadgeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRevokeBadgeResult" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/badges/restore:
    post:
      operationId: adminRestoreBadge
      tags: [admin]
      summary: Restore a previously revoked AISE or AISE_BUILD badge (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRestoreBadgeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRestoreBadgeResult" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Badge is not currently revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/badges/revocation-preview:
    get:
      operationId: adminPreviewBadgeRevocation
      tags: [admin]
      summary: Preview a user's prior revocation history for a badge before revoking (admin only)
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: badgeId
          in: query
          required: true
          schema: { type: string, enum: [AISE, AISE_BUILD] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBadgeRevocationPreview" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/badges/revocations:
    get:
      operationId: adminListBadgeRevocations
      tags: [admin]
      summary: List recent badge revocations (admin only)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBadgeRevocationsList" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/evolve:
    post:
      operationId: harnessEvolve
      tags: [harness]
      summary: DE-SPC — synthesise a Digitally Evolved SPC from N MA birth packages (requires ASPE badge)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessEvolveInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /verify:
    get:
      operationId: verifyCertificate
      tags: [verify]
      parameters:
        - name: cert
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResult" }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Forbidden (tier or role gate)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    DeepHealth:
      type: object
      required: [status, db, engines]
      properties:
        status: { type: string }
        db: { type: string, enum: [ok, error] }
        engines: { type: string, enum: [ok, degraded, error] }
        version: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    StripeWebhookPayload:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: ["string", "null"] }

    SubscriberTier:
      type: string
      enum: [EXPLORER, PRACTITIONER, ARCHITECT, INSTITUTION]

    CertTier:
      type: string
      enum: [BRONZE, SILVER, GOLD, PLATINUM, NONE]

    FeatureStatus:
      type: string
      enum: [LOCKED, AVAILABLE, IN_PROGRESS, COMPLETE]

    ArtifactType:
      type: string
      enum:
        - PROMPT_DIAGNOSTIC
        - ATOMIC_PROMPT
        - MA_BIRTH_PACKAGE
        - MICRO_PDD
        - SPC
        - ATLAS_PDD
        - MVP_PDD
        - CODEBASE_BUNDLE

    CodeDjPlatform:
      type: string
      description: Deployment / framework target for the Code DJ scaffold.
      enum:
        - nextjs-vercel
        - react-vite-static
        - express-replit
        - expo-mobile
        - pnpm-monorepo

    CodebaseFile:
      type: object
      required: [path, language, content]
      properties:
        path:     { type: string, description: "Project-root-relative path, e.g. src/index.ts" }
        language: { type: string, description: "ISO-ish language hint, e.g. typescript, json, md, env" }
        content:  { type: string }

    CodebaseManifest:
      type: object
      required: [framework, language, entrypoint, installCommand, runCommand, deployTarget]
      properties:
        framework:      { type: string }
        language:       { type: string }
        entrypoint:     { type: string }
        installCommand: { type: string }
        runCommand:     { type: string }
        buildCommand:   { type: ["string", "null"] }
        deployTarget:   { type: string }

    HarnessF8Input:
      type: object
      required: [sessionId, mvpPddArtifactId, platform]
      properties:
        sessionId:        { type: string, format: uuid }
        mvpPddArtifactId: { type: string, format: uuid }
        platform:         { $ref: "#/components/schemas/CodeDjPlatform" }
        notes:
          type: string
          description: Optional operator hints for the Code DJ (preferred libs, naming, etc.).
          maxLength: 2000
        provider: { $ref: "#/components/schemas/LlmProvider" }

    CodebaseBundle:
      type: object
      required: [artifactId, platform, manifest, files, notes]
      properties:
        artifactId: { type: string, format: uuid }
        platform:   { $ref: "#/components/schemas/CodeDjPlatform" }
        manifest:   { $ref: "#/components/schemas/CodebaseManifest" }
        files:
          type: array
          items: { $ref: "#/components/schemas/CodebaseFile" }
        notes:      { type: string }

    Subscriber:
      type: object
      required: [tier, status]
      properties:
        tier: { $ref: "#/components/schemas/SubscriberTier" }
        status: { type: string }
        currentPeriodEnd: { type: ["string", "null"], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        usage:
          type: object
          required: [f1, f2, f3, f4, f5, f6, f7, f8]
          properties:
            f1: { type: integer }
            f2: { type: integer }
            f3: { type: integer }
            f4: { type: integer }
            f5: { type: integer }
            f6: { type: integer }
            f7: { type: integer }
            f8: { type: integer }

    MeResponse:
      type: object
      required: [id, clerkUserId, role, subscriber]
      properties:
        id: { type: string, format: uuid }
        clerkUserId: { type: string }
        email: { type: ["string", "null"] }
        displayName: { type: ["string", "null"] }
        role: { type: string }
        subscriber: { $ref: "#/components/schemas/Subscriber" }

    UsageWindow:
      type: object
      required: [totalTokens, totalCostUsd]
      properties:
        totalTokens: { type: integer }
        totalCostUsd: { type: number }

    UsageByEngine:
      type: object
      required: [engineId, runs, totalTokens, totalCostUsd]
      properties:
        engineId: { type: integer }
        runs: { type: integer }
        totalTokens: { type: integer }
        totalCostUsd: { type: number }

    UsageReport:
      type: object
      required: [day, month, byEngine]
      properties:
        day: { $ref: "#/components/schemas/UsageWindow" }
        month: { $ref: "#/components/schemas/UsageWindow" }
        byEngine:
          type: array
          items: { $ref: "#/components/schemas/UsageByEngine" }

    UpdateProfileInput:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }

    DeleteAccountInput:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must be exactly "DELETE" to proceed.

    DeleteAccountResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        deletedAt: { type: string, format: date-time }

    MyDataExport:
      type: object
      required: [exportedAt, user, subscriber, sessions, artifacts, badges, engineRunCount]
      properties:
        exportedAt: { type: string, format: date-time }
        user:
          type: object
          additionalProperties: true
        subscriber:
          type: object
          additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: true
        badges:
          type: array
          items:
            type: object
            additionalProperties: true
        engineRunCount: { type: integer }

    LlmProvider:
      type: string
      enum: [claude, openai, gemini]
      description: |
        LLM provider for HARNESS engine calls. Defaults to `claude`. Non-claude
        providers (`openai`, `gemini`) require PRACTITIONER tier or higher.

    HarnessSession:
      type: object
      required: [id, sessionName, status, origin, ingestionId, cartridgeId, preferredModelProvider, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sessionName: { type: string }
        status: { type: string }
        origin: { type: string, enum: [manual, ingested, cartridge] }
        ingestionId: { type: string, format: uuid, nullable: true }
        cartridgeId: { type: string, format: uuid, nullable: true }
        preferredModelProvider: { $ref: "#/components/schemas/LlmProvider" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IngestionDocument:
      type: object
      required:
        [id, originalFilename, mimeType, fileSizeBytes, sourceDocKind,
         extractedTextChars, summary, seedPrompt, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalFilename: { type: string }
        mimeType: { type: string }
        fileSizeBytes: { type: integer }
        sourceDocKind:
          type: string
          enum: [product_design_document, software_design_document, concept_note, spec_sheet, other]
        detectedTitle: { type: string, nullable: true }
        extractedTextChars: { type: integer }
        summary: { type: string }
        seedPrompt: { type: string }
        createdAt: { type: string, format: date-time }

    ContextCraftBadge:
      type: object
      required: [pillar, letter, earned, bestScore, maxScore, threshold, firstEarnedAt, evidenceArtifactId]
      properties:
        pillar:
          type: string
          enum: [SYSTEM, ROLE, INSTRUCTION, DATA, FORMAT, EXAMPLE, CONSTRAINT]
        letter: { type: string, minLength: 1, maxLength: 1 }
        earned: { type: boolean }
        bestScore: { type: integer }
        maxScore: { type: integer }
        threshold: { type: integer }
        firstEarnedAt: { type: string, format: date-time, nullable: true }
        evidenceArtifactId: { type: string, format: uuid, nullable: true }

    IngestStartSessionInput:
      type: object
      properties:
        sessionName: { type: string, minLength: 1, maxLength: 255 }
        seedPrompt: { type: string, minLength: 20, maxLength: 4000 }
        detectedTitle: { type: string, minLength: 1, maxLength: 500 }

    SessionDetail:
      type: object
      required: [session, featureState, artifacts]
      properties:
        session: { $ref: "#/components/schemas/HarnessSession" }
        featureState:
          type: array
          items: { $ref: "#/components/schemas/FeatureState" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/HarnessArtifact" }

    SessionInput:
      type: object
      required: [sessionName]
      properties:
        sessionName: { type: string, minLength: 1, maxLength: 255 }
        preferredModelProvider: { $ref: "#/components/schemas/LlmProvider" }

    SessionUpdate:
      type: object
      properties:
        sessionName: { type: string, minLength: 1, maxLength: 255 }
        status: { type: string }
        preferredModelProvider: { $ref: "#/components/schemas/LlmProvider" }

    FeatureState:
      type: object
      required: [id, sessionId, featureId, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        featureId: { type: integer, minimum: 1, maximum: 7 }
        status: { $ref: "#/components/schemas/FeatureStatus" }
        unlockedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: string, format: date-time }

    HarnessArtifact:
      type: object
      required: [id, sessionId, featureId, artifactType, artifactContent, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        featureId: { type: integer }
        artifactType: { $ref: "#/components/schemas/ArtifactType" }
        artifactContent: { type: object, additionalProperties: true }
        jcseScore: { type: ["integer", "null"] }
        certTier: { type: ["string", "null"] }
        groState: { type: string }
        spartanCert: { type: ["object", "null"], additionalProperties: true }
        provider: { type: ["string", "null"], enum: [claude, openai, gemini, null] }
        modelId: { type: ["string", "null"] }
        runDurationMs: { type: ["integer", "null"] }
        runInputTokens: { type: ["integer", "null"] }
        runOutputTokens: { type: ["integer", "null"] }
        runAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    JcseBreakdown:
      type: object
      required: [system, role, instruction, example, constraint, format, data, total]
      properties:
        system: { type: integer }
        role: { type: integer }
        instruction: { type: integer }
        example: { type: integer }
        constraint: { type: integer }
        format: { type: integer }
        data: { type: integer }
        total: { type: integer }

    PillarAssessment:
      type: object
      required: [pillar, score, max, notes]
      properties:
        pillar:
          type: string
          enum: [SYSTEM, ROLE, INSTRUCTION, EXAMPLE, CONSTRAINT, FORMAT, DATA]
        score: { type: integer }
        max: { type: integer }
        notes: { type: string }
        gapHints:
          type: array
          items: { type: string }

    AtomicPromptTuple:
      type: object
      required: [system, role, instruction, example, constraint, format, data]
      properties:
        system: { type: string }
        role: { type: string }
        instruction: { type: string }
        example: { type: string }
        constraint: { type: string }
        format: { type: string }
        data: { type: string }

    PromptDiagnostic:
      type: object
      required: [jcse, certTier, pillars, atomicPrompt, strengths, gaps]
      properties:
        jcse: { $ref: "#/components/schemas/JcseBreakdown" }
        certTier: { $ref: "#/components/schemas/CertTier" }
        pillars:
          type: array
          items: { $ref: "#/components/schemas/PillarAssessment" }
        atomicPrompt: { $ref: "#/components/schemas/AtomicPromptTuple" }
        strengths:
          type: array
          items: { type: string }
        gaps:
          type: array
          items: { type: string }
        artifactId: { type: ["string", "null"], format: uuid }

    AtomicPrompt:
      type: object
      required: [tuple, jcse, certTier]
      properties:
        tuple: { $ref: "#/components/schemas/AtomicPromptTuple" }
        jcse: { $ref: "#/components/schemas/JcseBreakdown" }
        certTier: { $ref: "#/components/schemas/CertTier" }
        artifactId: { type: ["string", "null"], format: uuid }

    HarnessF1Input:
      type: object
      required: [sessionId, prompt]
      properties:
        sessionId: { type: string, format: uuid }
        prompt: { type: string, minLength: 10 }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    HarnessF2Input:
      type: object
      required: [sessionId, tuple]
      properties:
        sessionId: { type: string, format: uuid }
        tuple: { $ref: "#/components/schemas/AtomicPromptTuple" }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    HarnessF3Input:
      type: object
      required: [sessionId, atomicPrompt]
      properties:
        sessionId: { type: string, format: uuid }
        atomicPrompt: { $ref: "#/components/schemas/AtomicPromptTuple" }
        intent: { type: string }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    MaClassification:
      type: object
      required: [phase, kind, confidence]
      properties:
        phase: { type: string, enum: [PHASE_1, PHASE_2, PHASE_3] }
        kind: { type: string }
        confidence: { type: number }
        rationale: { type: string }

    MaBirthPackage:
      type: object
      required: [classification, organelles, birthPackage]
      properties:
        classification: { $ref: "#/components/schemas/MaClassification" }
        organelles:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string }
              output: { type: ["string", "null"] }
        birthPackage:
          type: object
          required: [overview, capability, knowledge, behaviour, lifecycle]
          properties:
            overview: { type: string }
            capability: { type: string }
            knowledge: { type: string }
            behaviour: { type: string }
            lifecycle: { type: string }
        escalated: { type: boolean }
        artifactId: { type: ["string", "null"], format: uuid }

    HarnessF4Input:
      type: object
      required: [sessionId, sourceArtifactId, targetVibe]
      properties:
        sessionId: { type: string, format: uuid }
        sourceArtifactId: { type: string, format: uuid }
        targetVibe: { type: string }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    MicroPdd:
      type: object
      required: [cheatSheet, worksheet, buildLaunch, interfaceContract]
      properties:
        cheatSheet: { type: string }
        worksheet: { type: string }
        buildLaunch: { type: string }
        interfaceContract: { type: string }
        artifactId: { type: ["string", "null"], format: uuid }

    HarnessF5Input:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string, format: uuid }
        step: { type: integer, minimum: 1, maximum: 7 }
        answers:
          type: object
          additionalProperties: true
        finalize: { type: boolean }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    SpcSection:
      type: object
      required: [key, title, body]
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }

    Spc:
      type: object
      required: [sections, iqs, gro, zpos]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/SpcSection" }
        iqs: { type: number }
        gro: { type: string, enum: [SAFE_LIFE, GREY, RED] }
        zpos:
          type: object
          additionalProperties: true
        artifactId: { type: ["string", "null"], format: uuid }

    F5StepOutcome:
      type: object
      required: [done]
      properties:
        done: { type: boolean }
        nextStep: { type: ["integer", "null"] }
        nextQuestion: { type: ["string", "null"] }
        spc:
          oneOf:
            - { $ref: "#/components/schemas/Spc" }
            - { type: "null" }

    HarnessF6Input:
      type: object
      required: [sessionId, mode]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { type: string, enum: [FROM_SPC, FRESH] }
        sourceArtifactId: { type: ["string", "null"], format: uuid }
        brief: { type: ["string", "null"] }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    AtlasPdd:
      type: object
      required: [cheatSheet, execSummary, worksheet, implementation]
      properties:
        cheatSheet: { type: string }
        execSummary: { type: string }
        worksheet: { type: string }
        implementation: { type: string }
        artifactId: { type: ["string", "null"], format: uuid }

    HarnessF6VdjInput:
      type: object
      required: [sessionId, pddArtifactId]
      properties:
        sessionId: { type: string, format: uuid }
        pddArtifactId: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    VdjRecommendation:
      type: object
      required: [recommendedIde, recommendedVibe, rationale]
      properties:
        recommendedIde: { type: string }
        recommendedVibe: { type: string }
        rationale: { type: string }
        alternatives:
          type: array
          items:
            type: object
            required: [name, fit]
            properties:
              name: { type: string }
              fit: { type: number }

    HarnessF7Input:
      type: object
      required: [sessionId, pddArtifactId]
      properties:
        sessionId: { type: string, format: uuid }
        pddArtifactId: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    SpartanCert:
      type: object
      required: [certId, class, crP, issuedAt]
      properties:
        certId: { type: string }
        class: { type: string, enum: [A, B, C, NONE] }
        crP: { type: number }
        issuedAt: { type: string, format: date-time }

    MvpPdd:
      type: object
      required: [sections, cert]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/SpcSection" }
        cert: { $ref: "#/components/schemas/SpartanCert" }
        donut:
          type: object
          required: [a, b, c]
          properties:
            a: { type: number }
            b: { type: number }
            c: { type: number }
        artifactId: { type: ["string", "null"], format: uuid }

    CheckoutInput:
      type: object
      required: [tier, interval]
      properties:
        tier: { $ref: "#/components/schemas/SubscriberTier" }
        interval: { type: string, enum: [month, year] }
        successUrl: { type: ["string", "null"] }
        cancelUrl: { type: ["string", "null"] }

    CheckoutSession:
      type: object
      required: [url]
      properties:
        url: { type: string }

    CartridgeCheckoutInput:
      type: object
      properties:
        successUrl: { type: ["string", "null"] }
        cancelUrl: { type: ["string", "null"] }

    CartridgeCreditsSummary:
      type: object
      required: [available, consumed, total]
      properties:
        available: { type: integer, minimum: 0 }
        consumed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    CartridgeLinkKind:
      type: string
      enum: [git, database]

    CartridgeDocumentSummary:
      type: object
      required: [id, originalFilename, mimeType, fileSizeBytes, extractedTextChars, summary]
      properties:
        id: { type: string, format: uuid }
        originalFilename: { type: string }
        mimeType: { type: string }
        fileSizeBytes: { type: integer }
        extractedTextChars: { type: integer }
        summary: { type: string }

    CartridgeSpcSummary:
      type: object
      required: [id, label, summary, body]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        summary: { type: string }
        body: { type: string }

    CartridgeLinkSummary:
      type: object
      required: [id, kind, descriptor, note]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/CartridgeLinkKind" }
        descriptor: { type: string }
        note: { type: ["string", "null"] }

    CartridgePackage:
      type: object
      required:
        [id, projectName, outcomeOneLiner, scopeStatement, seedPrompt, summary,
         createdAt, documents, spcs, links]
      properties:
        id: { type: string, format: uuid }
        projectName: { type: string }
        outcomeOneLiner: { type: string }
        scopeStatement: { type: string }
        targetPlatformHint: { type: ["string", "null"] }
        seedPrompt: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        documents:
          type: array
          items: { $ref: "#/components/schemas/CartridgeDocumentSummary" }
        spcs:
          type: array
          items: { $ref: "#/components/schemas/CartridgeSpcSummary" }
        links:
          type: array
          items: { $ref: "#/components/schemas/CartridgeLinkSummary" }

    CartridgeStartSessionInput:
      type: object
      properties:
        sessionName: { type: string, minLength: 1, maxLength: 255 }

    IngestionCheckoutInput:
      type: object
      properties:
        successUrl: { type: ["string", "null"] }
        cancelUrl: { type: ["string", "null"] }

    IngestionCreditsSummary:
      type: object
      required: [available, consumed, total]
      properties:
        available: { type: integer, minimum: 0 }
        consumed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    PortalInput:
      type: object
      properties:
        returnUrl: { type: ["string", "null"] }

    PortalSession:
      type: object
      required: [url]
      properties:
        url: { type: string }

    PricingTier:
      type: object
      required: [id, name, priceMonthly, priceYearly, features]
      properties:
        id: { $ref: "#/components/schemas/SubscriberTier" }
        name: { type: string }
        tagline: { type: string }
        priceMonthly: { type: ["number", "null"] }
        priceYearly: { type: ["number", "null"] }
        priceLabel: { type: ["string", "null"] }
        ctaLabel: { type: string }
        featured: { type: boolean }
        features:
          type: array
          items: { type: string }

    PricingPayload:
      type: object
      required: [tiers, faqs, trust]
      properties:
        tiers:
          type: array
          items: { $ref: "#/components/schemas/PricingTier" }
        faqs:
          type: array
          items:
            type: object
            required: [q, a]
            properties:
              q: { type: string }
              a: { type: string }
        trust:
          type: array
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              icon: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"], format: date-time }

    VerifyResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        certId: { type: ["string", "null"] }
        class: { type: ["string", "null"] }
        crP: { type: ["number", "null"] }
        issuedAt: { type: ["string", "null"], format: date-time }
        sessionName: { type: ["string", "null"] }
        provider: { type: ["string", "null"] }
        modelId: { type: ["string", "null"] }

    ExemplarSummary:
      type: object
      required: [id, title, tagline, jcse, certClass, source, kind, disc]
      properties:
        id: { type: string }
        title: { type: string }
        tagline: { type: string }
        jcse: { type: ["integer", "null"] }
        certClass: { type: ["string", "null"] }
        source:
          type: string
          enum: [canonical, hand_authored, generated]
        kind:
          type: string
          enum: [SPC, PDD]
        disc:
          type: ["string", "null"]
          description: "DISC personality profile (Dominance / Influence / Steadiness / Conscientiousness). Every SPC has a unique DISC fingerprint; PDDs are null."

    Exemplar:
      allOf:
        - $ref: "#/components/schemas/ExemplarSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    PromptLibraryItem:
      type: object
      required: [id, sessionId, artifactType, preview, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        sessionName: { type: ["string", "null"] }
        artifactType: { $ref: "#/components/schemas/ArtifactType" }
        certTier: { type: ["string", "null"] }
        jcseScore: { type: ["integer", "null"] }
        spcOrigin: { type: ["string", "null"], enum: [artisanal, digitally_evolved, null] }
        preview: { type: string }
        createdAt: { type: string, format: date-time }

    PromptLibraryPage:
      type: object
      required: [page, pageSize, total, items]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/PromptLibraryItem" }

    BadgeProgress:
      type: object
      required:
        [
          badgeId,
          status,
          eligible,
          progress,
          requirements,
          evidence,
          unlockedAt,
          claimedAt,
          revokedAt,
          revokedReason,
          revocationCount,
          restoredAt,
          restoredNote,
        ]
      properties:
        badgeId: { type: string, enum: [ASPE, AISA, AISE, AISA_PWDD, AISE_BUILD] }
        status: { type: string, enum: [LOCKED, UNLOCKED, CLAIMED, REVOKED] }
        eligible: { type: boolean }
        progress: { type: object, additionalProperties: { type: integer } }
        requirements: { type: object, additionalProperties: { type: integer } }
        evidence: { type: object, additionalProperties: true }
        unlockedAt: { type: ["string", "null"], format: date-time }
        claimedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        revokedReason: { type: ["string", "null"] }
        revocationCount: { type: integer, minimum: 0 }
        restoredAt: { type: ["string", "null"], format: date-time }
        restoredNote: { type: ["string", "null"] }

    AiseClaimInput:
      type: object
      properties:
        spcDnaAgentUrl: { type: string, format: uri }
        gptUrl: { type: string, format: uri }
        copilotUrl: { type: string, format: uri }
        nativeAppUrl: { type: string, format: uri }
        notes: { type: string }

    EngineerClaimInput:
      type: object
      required: [url, evidenceNote]
      properties:
        url: { type: string, format: uri }
        evidenceNote: { type: string, minLength: 1, maxLength: 500 }
        sessionId: { type: string, format: uuid }

    AdminRevokeBadgeInput:
      type: object
      required: [userId, badgeId, reason]
      properties:
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    AdminRevokeBadgeResult:
      type: object
      required: [ok, userId, badgeId, revokedAt, reason, revocationCount]
      properties:
        ok: { type: boolean }
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        revokedAt: { type: string, format: date-time }
        reason: { type: string }
        revocationCount: { type: integer, minimum: 1 }

    AdminRestoreBadgeInput:
      type: object
      required: [userId, badgeId]
      properties:
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        note: { type: string, maxLength: 1000 }

    AdminRestoreBadgeResult:
      type: object
      required: [ok, userId, badgeId, restoredAt, status, revocationCount]
      properties:
        ok: { type: boolean }
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        restoredAt: { type: string, format: date-time }
        status: { type: string, enum: [CLAIMED] }
        revocationCount: { type: integer, minimum: 0 }
        note: { type: string, nullable: true }

    BadgeRevocationParty:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true

    BadgeRevocationEntry:
      type: object
      required: [id, badgeId, reason, revokedAt, admin, target]
      properties:
        id: { type: string, format: uuid }
        badgeId: { type: string }
        reason: { type: string }
        revokedAt: { type: string, format: date-time }
        admin: { $ref: "#/components/schemas/BadgeRevocationParty" }
        target: { $ref: "#/components/schemas/BadgeRevocationParty" }

    AdminBadgeRevocationPreviewEntry:
      type: object
      required: [revokedAt, reason]
      properties:
        revokedAt: { type: string, format: date-time }
        revokedByUserId:
          type: string
          format: uuid
          nullable: true
        reason: { type: string }

    AdminBadgeRevocationPreview:
      type: object
      required: [userId, badgeId, badgeExists, currentStatus, revocationCount, history]
      properties:
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        badgeExists: { type: boolean }
        currentStatus:
          type: string
          enum: [LOCKED, UNLOCKED, CLAIMED, REVOKED]
          nullable: true
        revocationCount: { type: integer, minimum: 0 }
        lastRevokedAt:
          type: string
          format: date-time
          nullable: true
        lastReason:
          type: string
          nullable: true
        history:
          type: array
          items: { $ref: "#/components/schemas/AdminBadgeRevocationPreviewEntry" }

    AdminBadgeRevocationsList:
      type: object
      required: [revocations]
      properties:
        revocations:
          type: array
          items: { $ref: "#/components/schemas/BadgeRevocationEntry" }

    HarnessEvolveInput:
      type: object
      required: [sessionId, maArtifactIds]
      properties:
        sessionId: { type: string, format: uuid }
        maArtifactIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 2
          maxItems: 12
        provider: { $ref: "#/components/schemas/LlmProvider" }
