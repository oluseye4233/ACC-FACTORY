openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ATANDA Command Centre + HARNESS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: me
  - name: sessions
  - name: artifacts
  - name: harness
  - name: billing
  - name: pricing
  - name: admin
  - name: cron
  - name: verify
  - name: exemplars
  - name: prompts
  - name: badges
  - name: export
  - name: f1000
  - name: magnet

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Basic liveness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health:
    get:
      operationId: healthDeep
      tags: [health]
      summary: Deep health (db + engines)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeepHealth" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current authenticated user + subscriber
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/usage:
    get:
      operationId: getMyUsage
      tags: [me]
      summary: Token + cost usage for the calling user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [me]
      summary: Update the calling user's display name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/export:
    get:
      operationId: exportMyData
      tags: [me]
      summary: Download a JSON bundle of all of the user's account data (GDPR portability)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDataExport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/delete:
    post:
      operationId: deleteMyAccount
      tags: [me]
      summary: Permanently delete the calling user's account and all associated data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountInput" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteAccountResult" }
        "400":
          description: Confirmation phrase missing or incorrect
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessSession" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
    delete:
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Deleted

  /me/context-craft-badges:
    get:
      operationId: listMyContextCraftBadges
      tags: [me]
      summary: List the 7 Context Craft pillar mini-quest badges (earned + locked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContextCraftBadge" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}/ingestion:
    get:
      operationId: getSessionIngestion
      tags: [sessions]
      summary: Get the ingestion record linked to this session (404 if origin=manual)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}:
    get:
      operationId: getIngestion
      tags: [sessions]
      summary: Fetch a previously-ingested document by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}/start-session:
    post:
      operationId: startSessionFromIngestion
      tags: [sessions]
      summary: Create a HARNESS session seeded from an ingested document
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestStartSessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/feature-state:
    get:
      operationId: listFeatureState
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureState" }

  /sessions/{id}/artifacts:
    get:
      operationId: listSessionArtifacts
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessArtifact" }

  /sessions/{id}/mathmon:
    get:
      operationId: getSessionMathmon
      tags: [harness]
      summary: MATHMON state for a session (intake + MAP + FORGE VERIFIED gate)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MathmonState" }
        "404":
          $ref: "#/components/responses/NotFound"

  /artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "404":
          $ref: "#/components/responses/NotFound"
  /artifacts/{id}/name:
    patch:
      operationId: renameArtifact
      tags: [artifacts]
      summary: Rename an artifact (e.g. name your SPC)
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameArtifactInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/f1:
    post:
      operationId: harnessF1
      tags: [harness]
      summary: ATLAS Prompt Diagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF1Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptDiagnostic" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /magnet/test-kit:
    post:
      operationId: magnetTestKit
      tags: [magnet]
      summary: Anonymous Agent Test Kit — returns a coarse quality band only
      description: >
        Public, pre-auth acquisition magnet. Runs a single lightweight inference
        and returns a quality BAND only (LITE-PASS / LITE-REVIEW / LITE-FAIL).
        The raw numeric score is computed and bucketed server-side and is never
        returned. Rate limited to 5 requests/hour per IP/email. Ephemeral: the
        submitted text is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagnetTestKitInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagnetTestKitResult" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /magnet/calculator:
    post:
      operationId: magnetCalculator
      tags: [magnet]
      summary: Anonymous Savings Calculator — returns a compression-savings range only
      description: >
        Public, pre-auth acquisition magnet. Runs a single lightweight inference
        and returns a compression-savings RANGE (low–high %), never a single
        precise percentage. Signal counts are bucketed into the range
        server-side. Rate limited to 5 requests/hour per IP/email. Ephemeral: the
        submitted text is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagnetCalculatorInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagnetCalculatorResult" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /magnet/conversion:
    post:
      operationId: magnetConversion
      tags: [magnet]
      summary: Record that a magnet visitor clicked through to the front door
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagnetConversionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /harness/f2:
    post:
      operationId: harnessF2
      tags: [harness]
      summary: Atomic Prompt Builder certification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF2Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtomicPrompt" }

  /harness/f3:
    post:
      operationId: harnessF3Stream
      tags: [harness]
      summary: CELL MA Builder (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF3Input" }
      responses:
        "200":
          description: text/event-stream of MA cultivation events
          content:
            text/event-stream:
              schema: { type: string }

  /harness/f4:
    post:
      operationId: harnessF4
      tags: [harness]
      summary: Micro PDD converter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF4Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroPdd" }

  /harness/f5:
    post:
      operationId: harnessF5
      tags: [harness]
      summary: SPC Builder (FORGE Q&A turn)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF5Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F5StepOutcome" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f5-finalize:
    post:
      operationId: harnessF5FinalizeStream
      tags: [harness]
      summary: SPC Builder — FORGE.COMMIT synthesis (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF5FinalizeInput" }
      responses:
        "200":
          description: text/event-stream of FORGE.COMMIT synthesis events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f6:
    post:
      operationId: harnessF6
      tags: [harness]
      summary: ATLAS PDD Drafter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF6Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtlasPdd" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f6-finalize:
    post:
      operationId: harnessF6DraftStream
      tags: [harness]
      summary: ATLAS PDD Drafter (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF6FinalizeInput" }
      responses:
        "200":
          description: text/event-stream of ATLAS PDD draft events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f6-vdj:
    post:
      operationId: harnessF6Vdj
      tags: [harness]
      summary: VIBE DJ recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF6VdjInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VdjRecommendation" }
        "403":
          description: Tier insufficient (requires Practitioner+)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /harness/f05:
    post:
      operationId: harnessF05
      tags: [harness]
      summary: MATHMON Applicability Layer — intake report
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF05Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MathmonIntake" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/map:
    post:
      operationId: harnessMapStream
      tags: [harness]
      summary: Mathematical Applicability Profile builder (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessMapInput" }
      responses:
        "200":
          description: text/event-stream of MAP generation events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/f7:
    post:
      operationId: harnessF7Stream
      tags: [harness]
      summary: SPARTAN Compressor (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF7Input" }
      responses:
        "200":
          description: text/event-stream of SPARTAN 7-step events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f8:
    post:
      operationId: harnessF8
      tags: [harness]
      summary: Code DJ — scaffold a codebase from a certified MVP PDD (Architect tier)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF8Input" }
      responses:
        "200":
          description: Codebase bundle scaffolded from the source MVP PDD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodebaseBundle" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/f8-hdj:
    post:
      operationId: harnessF8Hdj
      tags: [harness]
      summary: Host DJ — recommend a host + deployment journey from a certified MVP PDD (Architect tier)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF8HdjInput" }
      responses:
        "200":
          description: Hosting plan produced from the certified MVP PDD (and optional codebase bundle)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostingPlan" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source MVP PDD is not SPARTAN-certified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /harness/atlas-crystallise:
    post:
      operationId: harnessAtlasCrystallise
      tags: [harness]
      summary: Crystallise a 4-Part ATLAS PDD into the typed ATLAS J JSON layer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessAtlasCrystalliseInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtlasPddJson" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/pfp:
    post:
      operationId: harnessPfp
      tags: [harness]
      summary: PDD Fidelity Protocol — cross-reference an MVP PDD against a codebase bundle (BUGMXT Layer 4 drift detection)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessPfpInput" }
      responses:
        "200":
          description: Drift report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PfpReport" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source MVP PDD is not SPARTAN-certified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /harness/escalations/stream:
    get:
      operationId: harnessEscalationsStream
      tags: [harness]
      summary: SSE feed of escalations for a session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /f1000/status:
    get:
      operationId: f1000Status
      tags: [f1000]
      summary: Public remaining-count for the First 1000 soft-launch offer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F1000StatusResult" }

  /f1000/activate:
    post:
      operationId: f1000Activate
      tags: [f1000]
      summary: Claim the next available F1000 invite code (public, IP rate-limited)
      responses:
        "200":
          description: An invite code was issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F1000ActivateResult" }
        "410":
          description: The First 1000 offer is fully claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /f1000/redeem:
    post:
      operationId: f1000Redeem
      tags: [f1000]
      summary: Bind an F1000 invite code to the signed-in user and unlock the offer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/F1000RedeemInput" }
      responses:
        "200":
          description: Offer unlocked (or already unlocked for this user)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F1000RedeemResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or invalid invite code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Code already redeemed by another account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: The First 1000 offer is fully claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /billing/checkout:
    post:
      operationId: billingCheckout
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }

  /billing/ingestion/checkout:
    post:
      operationId: billingIngestionCheckout
      tags: [billing]
      summary: One-time Stripe checkout for a single ingestion project credit
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestionCheckoutInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "503":
          description: Billing not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /ingestion-credits:
    get:
      operationId: getIngestionCredits
      tags: [billing]
      summary: Available + consumed ingestion credit balance for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionCreditsSummary" }

  /billing/cartridge/checkout:
    post:
      operationId: billingCartridgeCheckout
      tags: [billing]
      summary: One-time Stripe checkout for a single Advanced Cartridge credit
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartridgeCheckoutInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "503":
          description: Billing not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /cartridge-credits:
    get:
      operationId: getCartridgeCredits
      tags: [billing]
      summary: Available + consumed cartridge credit balance for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartridgeCreditsSummary" }

  /cartridge:
    post:
      operationId: createCartridge
      tags: [sessions]
      summary: |
        Create a cartridge package (multi-document + SPCs + optional links).
