      type: object
      required: [verdict, mecha_run_id, phase_halted, constraint_cited, invariant_cited, cause, required_to_proceed, gro_mode]
      properties:
        verdict: { type: string, enum: [REFUSED] }
        mecha_run_id: { type: string }
        phase_halted: { type: integer, minimum: 1, maximum: 7 }
        constraint_cited: { type: string }
        invariant_cited: { type: string }
        cause: { type: string }
        required_to_proceed: { type: string }
        gro_mode: { type: string, enum: [HUMAN_IN_LOOP, CONTAINMENT, KILLZONE] }

