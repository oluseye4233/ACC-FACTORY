              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpcPlayerManifest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: atanda_staff

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Forbidden (tier or role gate)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    F10ExportInput:
      type: object
      required: [sourceArtifactId, outputKind, family, target]
      properties:
        sourceArtifactId: { type: string, format: uuid }
        outputKind: { type: string, enum: [SPC, MA, MPDD, PDD, CODE_DJ] }
        family: { type: string, enum: [AWS, AZURE, OPENAI_AGENTS, GEMINI_AGENTS, IDE, VIBE_APP, F0, SPC_PLAYER, LANGCHAIN, GITHUB, PROGRAMMING_ENVIRONMENT] }
        target:
          type: string
          minLength: 1
          maxLength: 120
          description: Closed provider target identifier; provider targets are not arbitrary provider names.
          enum: [AWS_LAMBDA, AWS_ECS_FARGATE, AWS_S3, AZURE_FUNCTIONS, AZURE_CONTAINER_APPS, AZURE_BLOB_STORAGE, OPENAI_AGENTS_SDK, GEMINI_ADK, GEMINI_VERTEX_AGENT_ENGINE, VS Code, Cursor, Windsurf, JetBrains, Replit, Visual Studio, Xcode, Android Studio, Eclipse, Vim/Neovim, Replit Agent, Lovable, Bolt, v0, Base44, TypeScript/Node, Python, Java, C#, C++, Go, Rust, PHP, Ruby, Swift, Kotlin, F0, SPC_PLAYER, LANGCHAIN, GITHUB]
        deliveryMode: { type: string, enum: [EXPORT, INTERNAL_HANDOFF] }
    F10GitHubPushInput:
      allOf:
        - $ref: "#/components/schemas/F10ExportInput"
        - type: object
          required: [repository, branch]
          properties:
            family: { type: string, enum: [GITHUB] }
            repository: { type: string, pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$" }
            branch: { type: string, minLength: 1, maxLength: 255 }
    F10GitHubPushResult:
      type: object
      required: [ok, idempotent, idempotencyKey, repository, branch, commitSha, commitUrl, bundleSha256, pushedAt]
      properties:
        ok: { type: boolean }
        idempotent: { type: boolean }
        idempotencyKey: { type: string }
        repository: { type: string }
        branch: { type: string }
        commitSha: { type: string }
        commitUrl: { type: string, format: uri }
        bundleSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        pushedAt: { type: string, format: date-time }
    F10Source:
      type: object
      required: [id, type, artifactType, outputKind, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [SPC, MA_BIRTH_PACKAGE, MICRO_PDD, ATLAS_PDD, ATLAS_PDD_JSON, MVP_PDD, CODEBASE_BUNDLE] }
        artifactType: { type: string, enum: [SPC, MA_BIRTH_PACKAGE, MICRO_PDD, ATLAS_PDD, ATLAS_PDD_JSON, MVP_PDD, CODEBASE_BUNDLE] }
        outputKind: { type: string, enum: [SPC, MA, MPDD, PDD, CODE_DJ] }
        name: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    F10Catalog:
      type: object
      required: [sourceTypes, outputKinds, families, httpsRelease]
      properties:
        sourceTypes: { type: array, items: { type: string } }
        outputKinds: { type: array, items: { type: string } }
        families: { type: array, items: { $ref: "#/components/schemas/F10CatalogFamily" } }
        httpsRelease: { $ref: "#/components/schemas/F10HttpsRelease" }
    F10CatalogFamily:
      type: object
      required: [family, liveMode, fallbackMode, deployed, configuration, targets, supportedOutputs]
      properties:
        family: { type: string, enum: [AWS, AZURE, OPENAI_AGENTS, GEMINI_AGENTS, IDE, VIBE_APP, F0, SPC_PLAYER, LANGCHAIN, GITHUB, PROGRAMMING_ENVIRONMENT] }
        liveMode: { type: string, enum: [EXPORT, INTERNAL_HANDOFF, USER_AUTHORIZED] }
        fallbackMode: { type: ["string", "null"], enum: [EXPORT, null] }
        deployed: { type: boolean }
        configuration: { type: string }
        targets: { type: array, items: { type: string } }
        supportedOutputs: { type: array, items: { type: string, enum: [SPC, MA, MPDD, PDD, CODE_DJ] } }
    F10HttpsRelease:
      type: object
      required: [separate, live, mode]
      properties:
        separate: { type: boolean }
        live: { type: boolean }
        mode: { type: string, enum: [SIGNED_F9_OSIRIS_HTTPS] }
    F10ExportManifest:
      type: object
      required: [schemaVersion, source, profile, files, bundleSha256]
      properties:
        schemaVersion: { type: string }
        source: { $ref: "#/components/schemas/F10ManifestSource" }
        profile: { $ref: "#/components/schemas/F10ManifestProfile" }
        bundleSha256Scope: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/F10ManifestFile" } }
        bundleSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    F10ManifestSource:
      type: object
      required: [id, type, name, contentSha256]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: ["string", "null"] }
        contentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    F10ManifestProfile:
      type: object
      required: [outputKind, family, target, deliveryMode]
      properties:
        outputKind: { type: string, enum: [SPC, MA, MPDD, PDD, CODE_DJ] }
        family: { type: string, enum: [AWS, AZURE, OPENAI_AGENTS, GEMINI_AGENTS, IDE, VIBE_APP, F0, SPC_PLAYER, LANGCHAIN, GITHUB, PROGRAMMING_ENVIRONMENT] }
        target: { type: string }
        deliveryMode: { type: string, enum: [EXPORT, INTERNAL_HANDOFF] }
    F10ManifestFile:
      type: object
      required: [path, mediaType, bytes, sha256, role]
      properties:
        path: { type: string }
        mediaType: { type: string }
        bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        role: { type: string }
    F10DestinationRequest:
      type: object
      additionalProperties: false
      required: [name, adapterId, adapterVersion, endpoint, secretRef, authorizationScopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        adapterId: { type: string, enum: [https] }
        adapterVersion: { type: string, enum: ["1"] }
        endpoint: { type: string, format: uri }
        secretRef: { type: string, pattern: "^F10_SECRET_[A-Z0-9_]+$" }
        authorizationScopes: { type: array, maxItems: 50, items: { type: string } }
    F10Destination:
      allOf:
        - $ref: "#/components/schemas/F10DestinationRequest"
        - type: object
          required: [id, active, createdAt]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            revokedAt: { type: [string, "null"], format: date-time }
            createdAt: { type: string, format: date-time }
    F10ProviderConnectionRequest:
      type: object
      additionalProperties: false
      required: [provider, name, scopes]
      properties:
        provider: { type: string, enum: [AWS, AZURE, OPENAI_AGENTS, GEMINI_AGENTS] }
        name: { type: string, minLength: 1, maxLength: 120 }
        scopes: { type: array, maxItems: 50, items: { type: string } }
    F10ProviderAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: { type: string, enum: [AWS, AZURE, OPENAI_AGENTS, GEMINI_AGENTS] }
        returnTo: { type: string, maxLength: 500 }
        connectionId: { type: string, format: uuid }
    F10ProviderConnection:
      allOf:
        - $ref: "#/components/schemas/F10ProviderConnectionRequest"
        - type: object
          required: [id, active, createdAt]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            revokedAt: { type: ["string", "null"], format: date-time }
            createdAt: { type: string, format: date-time }
    F10ColonizationInput:
      type: object
      additionalProperties: false
      required: [artifactRef, artifactHash, artifactClass, ucgCertificateRef, target, targetClass, connectorAdapter, consentChannel]
      properties:
        requestClass: { type: string, enum: [RUN, SENSE_ONLY, RE_VERIFY, ROLLBACK], default: RUN }
        artifactRef: { type: string, minLength: 1, maxLength: 500 }
        artifactHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        artifactClass: { type: string, enum: [SPC, MA, PDD, MPDD] }
        ucgCertificateRef: { type: string, minLength: 1, maxLength: 500 }
        target: { type: string, minLength: 1, maxLength: 500 }
        targetClass: { type: string, enum: [SOFTWARE_PLATFORM, AGENT_GATEWAY, FIRMWARE, ROBOTICS, APPLIANCE_IOT] }
        connectorAdapter: { type: string, minLength: 1, maxLength: 200 }
        customizationSet:
          type: object
          properties:
            packaging_fields_only: { type: object, additionalProperties: { type: string } }
        f9AttestationRef: { type: ["string", "null"], maxLength: 500 }
        consentChannel: { type: string, minLength: 1, maxLength: 200 }
        deploymentSubject: { type: string, minLength: 1, maxLength: 500, description: Immutable deployment identity to which certification and both consents are bound. }
        ucgColCertificate: { $ref: "#/components/schemas/F10UcgColCertificate" }
        stageConsent: { $ref: "#/components/schemas/F10StageConsent" }
        promotionConsent: { $ref: "#/components/schemas/F10PromotionConsent" }
        vaultHandle: { $ref: "#/components/schemas/F10VaultHandle" }
    F10UcgColCertificate:
      type: object
      additionalProperties: false
      required: [certificateRef, artifactHash, deploymentSubject, score, threshold, verdict, expiresAt]
      properties:
        certificateRef: { type: string, minLength: 1, maxLength: 500 }
        artifactHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        deploymentSubject: { type: string, minLength: 1, maxLength: 500 }
        score: { type: number, minimum: 0, maximum: 1 }
        threshold: { type: number, enum: [0.9], description: Governance-approved UCG-COL promotion threshold. }
        verdict: { type: string, enum: [PASS] }
        expiresAt: { type: string, format: date-time }
    F10ColonizationPromotionInput:
      type: object
      additionalProperties: false
      required: [deploymentSubject, ucgColCertificate, promotionConsent, vaultHandle]
      properties:
        deploymentSubject: { type: string, minLength: 1, maxLength: 500 }
        ucgColCertificate: { $ref: "#/components/schemas/F10UcgColCertificate" }
        promotionConsent: { $ref: "#/components/schemas/F10PromotionConsent" }
        vaultHandle: { $ref: "#/components/schemas/F10VaultHandle" }
    F10StageConsent:
      type: object
      additionalProperties: false
      required: [consentId, purpose, deploymentSubject, exactWriteHash]
      properties:
        consentId: { type: string, format: uuid }
        purpose: { type: string, enum: [STAGE] }
        deploymentSubject: { type: string, minLength: 1, maxLength: 500 }
        exactWriteHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$", description: SHA-256 binding this one-time consent to the exact stage write. }
    F10PromotionConsent:
      type: object
      additionalProperties: false
      required: [consentId, purpose, deploymentSubject, exactWriteHash]
      properties:
        consentId: { type: string, format: uuid }
        purpose: { type: string, enum: [PROMOTION] }
        deploymentSubject: { type: string, minLength: 1, maxLength: 500 }
        exactWriteHash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
          description: "SHA-256 binding consent #2 to the exact promotion write; it cannot be reused as stage consent."
    F10VaultHandle:
      type: object
      additionalProperties: false
      required: [handle, scope, deploymentSubject, expiresAt]
      properties:
        handle:
          type: string
          pattern: "^vault-handle:[A-Za-z0-9_-]{16,200}$"
          description: Opaque scoped reference. Credential material is never accepted or returned.
        scope: { type: string, enum: [F10_STAGE, F10_PROMOTION] }
        deploymentSubject: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: string, format: date-time }
    F10ColonizationRun:
      type: object
      required: [id, runId, artifactHash, artifactClass, target, targetClass, state, phase, maxReachablePhase, groMode, phaseStatuses, adapterReadiness, refusal, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string }
        artifactRef: { type: string }
        artifactHash: { type: string }
        artifactClass: { type: string }
        ucgCertificateRef: { type: string }
        target: { type: string }
        targetClass: { type: string }
        state: { type: string, enum: [RUNNING, REFUSED, STAGED_ONLY, PROMOTED] }
        phase: { type: string, enum: [C0, C1, C2, C3, C4, C5, C6, C7, C8] }
        maxReachablePhase: { type: string, enum: [C4, C8] }
        groMode: { type: string, enum: [SAFE_LIFE] }
        phaseStatuses: { $ref: "#/components/schemas/F10ColonizationPhaseStatuses" }
        adapterReadiness: { $ref: "#/components/schemas/F10ColonizationAdapterReadiness" }
        refusal: { $ref: "#/components/schemas/F10ColonizationRefusal" }
        deploymentSubject: { type: ["string", "null"] }
        ucgColCertificate: { oneOf: [{ $ref: "#/components/schemas/F10UcgColCertificate" }, { type: "null" }] }
        stageConsent: { oneOf: [{ $ref: "#/components/schemas/F10StageConsent" }, { type: "null" }] }
        promotionConsent: { oneOf: [{ $ref: "#/components/schemas/F10PromotionConsent" }, { type: "null" }] }
        vaultHandle: { oneOf: [{ $ref: "#/components/schemas/F10VaultHandle" }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    F10ColonizationPhaseStatuses:
      type: object
      additionalProperties: false
      required: [C0, C1, C2, C3, C4, C5, C6, C7, C8]
      properties:
        C0: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C1: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C2: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C3: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C4: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C5: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C6: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C7: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
        C8: { type: string, enum: [PENDING, ACTIVE, REFUSED, COMPLETE] }
    F10ColonizationAdapterReadiness:
      type: object
      additionalProperties: false
      required: [savant, connector, analyzer, vault, consentGate, ucgCol]
      properties:
        savant: { type: string, enum: [UNWIRED] }
        connector: { type: string, enum: [UNWIRED] }
        analyzer: { type: string, enum: [UNWIRED] }
        vault: { type: string, enum: [UNWIRED] }
        consentGate: { type: string, enum: [UNWIRED] }
        ucgCol: { type: string, enum: [UNWIRED] }
    F10ColonizationRefusal:
      type: object
      additionalProperties: false
      required: [phaseHalted, constraintCited, invariantCited, cause, requiredToProceed, groMode]
      properties:
        phaseHalted: { type: integer, minimum: 0, maximum: 8 }
        constraintCited: { type: string }
        invariantCited: { type: string }
        cause: { type: string }
        requiredToProceed: { type: string }
        groMode: { type: string, enum: [SAFE_LIFE, HUMAN_IN_LOOP, CONTAINMENT, KILLZONE] }
    F10BundleDeploymentRequest:
      type: object
      additionalProperties: false
      required: [sourceArtifactId, provider, target, connectionRef, outputKind, targetConfig, releaseIntent]
      properties:
        sourceArtifactId: { type: string, format: uuid }
        provider: { type: string, enum: [AWS, AZURE, OPENAI_AGENTS, GEMINI_AGENTS] }
        target: { type: string, enum: [AWS_LAMBDA, AWS_ECS_FARGATE, AWS_S3, AZURE_FUNCTIONS, AZURE_CONTAINER_APPS, AZURE_BLOB_STORAGE, OPENAI_AGENTS_SDK, GEMINI_ADK, GEMINI_VERTEX_AGENT_ENGINE] }
        connectionRef: { type: string, format: uuid }
        outputKind: { type: string, enum: [SPC, MA, MPDD, PDD, CODE_DJ] }
        targetConfig:
          description: Provider-specific deployment target. Unknown fields are rejected.
          oneOf:
            - $ref: "#/components/schemas/F10AwsTargetConfig"
            - $ref: "#/components/schemas/F10AzureTargetConfig"
            - $ref: "#/components/schemas/F10OpenAiTargetConfig"
            - $ref: "#/components/schemas/F10GeminiTargetConfig"
        releaseIntent: { type: string, minLength: 1, maxLength: 200 }
    F10AwsTargetConfig:
      type: object
      additionalProperties: false
      required: [region, resourceName]
      properties:
        region: { type: string, minLength: 1 }
        resourceName: { type: string, minLength: 1 }
        accountId: { type: string }
        roleArn: { type: string }
    F10AzureTargetConfig:
      type: object
      additionalProperties: false
      required: [subscriptionId, resourceGroup, location, resourceName]
      properties:
        subscriptionId: { type: string, minLength: 1 }
        tenantId: { type: string }
        resourceGroup: { type: string, minLength: 1 }
        location: { type: string, minLength: 1 }
        resourceName: { type: string, minLength: 1 }
    F10OpenAiTargetConfig:
      type: object
      additionalProperties: false
      required: [model, environment]
      properties:
        projectId: { type: string }
        agentId: { type: string }
        model: { type: string, minLength: 1 }
        environment: { type: string, minLength: 1 }
    F10GeminiTargetConfig:
      type: object
      additionalProperties: false
      required: [projectId, location, model, environment]
      properties:
        projectId: { type: string, minLength: 1 }
        location: { type: string, minLength: 1 }
        agentId: { type: string }
        displayName: { type: string }
        model: { type: string, minLength: 1 }
        environment: { type: string, minLength: 1 }
        useVertex: { type: string, enum: ["true", "false"] }
    F10BundleDeployment:
      type: object
      required: [id, provider, target, state, bundleHash, executionStatus]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        target: { type: string }
        state: { type: string }
        bundleHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        executionStatus: { type: string, enum: [NOT_CONFIRMED, ACCEPTED, RUNNING, COMPLETED, FAILED] }
        executionCheckedAt: { type: ["string", "null"], format: date-time }
        providerExecutionUpdatedAt: { type: ["string", "null"], format: date-time }
        reconciliationPausedAt: { type: ["string", "null"], format: date-time }
        reconciliationPauseReason: { type: ["string", "null"] }
    F10BundleReconciliation:
      type: object
      required: [acceptance, executionStatus, checkedAt, changed]
      properties:
        acceptance: { type: string, enum: [ACCEPTED] }
        executionStatus: { type: string, enum: [ACCEPTED, RUNNING, COMPLETED, FAILED] }
        checkedAt: { type: string, format: date-time }
        providerUpdatedAt: { type: ["string", "null"], format: date-time }
        changed: { type: boolean }
    F10BundleDeploymentDetail:
      allOf:
        - $ref: "#/components/schemas/F10BundleDeployment"
        - type: object
          required: [audit, attempts, receipt]
          properties:
            audit:
              type: array
              items:
                type: object
                additionalProperties: true
            attempts:
              type: array
              items:
                type: object
                additionalProperties: true
            receipt:
              type: [object, "null"]
              additionalProperties: true
    F10ReleaseRequest:
      type: object
      additionalProperties: false
      required: [machineArtifactId, destinationId, releaseIntent]
      properties:
        machineArtifactId: { type: string }
        destinationId: { type: string, format: uuid }
        releaseIntent: { type: string }
        sessionId:
          type: string
          format: uuid
          description: Optional session scope used by the embedded Command Centre release flow.
    F10Envelope:
      type: object
      additionalProperties: false
      required: [machine_artifact_id, mecha_run_id, artifact_version, media_type, ucg_certificate, spk_id, payload_hash, artifact_signature, osiris_custody_attestation]
      properties:
        machine_artifact_id: { type: string }
        mecha_run_id: { type: string }
        artifact_version: { type: string }
        media_type: { type: string }
        ucg_certificate:
          type: object
          required: [verdict, expires_at, signature]
          properties:
            verdict: { type: string }
            expires_at: { type: string, format: date-time }
            signature: { type: string }
        spk_id: { type: string }
        payload_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        artifact_signature: { type: string }
        osiris_custody_attestation:
          type: object
          required: [osiris_custody, expires_at, signature]
          properties:
            osiris_custody: { type: boolean }
            expires_at: { type: string, format: date-time }
            signature: { type: string }
    F10Release:
      type: object
      description: Persisted release metadata and append-only transitions; no artifact bytes or secrets.
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [REQUESTED, VERIFYING, AUTHORIZED, QUEUED, DISPATCHING, ACKNOWLEDGED, BLOCKED, FAILED_PERMANENT, DEAD_LETTERED, CANCELLED] }
        idempotencyKey: { type: string }
        blockedReasons: { type: array, items: { type: string } }
        transitions: { type: array, items: { type: object } }
    # ── F0 · Business Intelligence Consulting Layer (Domain 23) ──────────────
    F0Service:
      type: string
      enum:
        - PRODUCT_VIABILITY
        - MARKET_VIABILITY
        - CAPI_POSITIONING
        - CUSTOMER_ACQUISITION
        - GO_TO_MARKET
        - FINANCIAL_PROJECTIONS
        - PRODUCT_SYNTHESIS_ADVISORY
        - OFFICER_ANALYSIS
        - COMPETITIVE_TEARDOWN
        - PRICING_STRATEGY
        - BRAND_NARRATIVE
        - INVESTOR_READINESS
        - MATHMON_MAX
        - EVE_MAX

    F0Engagement:
      type: object
      required: [id, userId, title, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [DISCOVERY, ACTIVE, CLOSED] }
        sessionId: { type: string, format: uuid, nullable: true }
        artifactId: { type: string, format: uuid, nullable: true }
        discoveryTranscript: { nullable: true }
        challengeResponse: { nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    F0Report:
      type: object
      required:
        [id, engagementId, userId, service, reportCode, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        engagementId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        service: { $ref: "#/components/schemas/F0Service" }
        reportCode: { type: string }
        sku: { type: string, nullable: true }
        content: { type: object, additionalProperties: true }
        accruedCostUsd: { type: string }
        createdAt: { type: string, format: date-time }

