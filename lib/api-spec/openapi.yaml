      properties:
        day: { $ref: "#/components/schemas/UsageWindow" }
        month: { $ref: "#/components/schemas/UsageWindow" }
        byEngine:
          type: array
          items: { $ref: "#/components/schemas/UsageByEngine" }

    CompanySpend:
      type: object
      description: >
        Company-wide LLM spend for the current UTC calendar month against the
        single shared monthly cost cap (STAFF_MONTHLY_COST_CAP_USD). Completed
        provider charges and active in-flight reservations are reported
        separately. The gate uses their sum; on success a reservation is
        atomically replaced by the recorded provider charge, and on failure it
        is released.
      required:
        [
          usedUsd,
          reservedUsd,
          remainingUsd,
          capUsd,
          percentUsed,
          overCap,
          warnLevel,
          monthResetsAt,
          alertsSent,
        ]
      properties:
        usedUsd:
          {
            type: number,
            description: "Completed month-to-date company-wide provider charges (USD); excludes temporary reservations",
          }
        reservedUsd:
          {
            type: number,
            description: "Active, unexpired worst-case reservations for in-flight model calls (USD); not completed charges",
          }
        remainingUsd:
          {
            type: number,
            description: "Usable budget remaining after completed charges and active reservations; never below zero (USD)",
          }
        capUsd: { type: number, description: "The shared monthly cap (USD)" }
        percentUsed:
          {
            type: number,
            description: "(usedUsd + reservedUsd) / capUsd as a percentage, clamped to [0, 100]",
          }
        overCap:
          {
            type: boolean,
            description: "True when completed charges plus active reservations reach the point that engine routes are refused with 402 COST_CAP_EXCEEDED",
          }
        warnLevel:
          type: string
          enum: [ok, warn, critical, blocked]
          description: "Based on completed charges plus reservations: ok < 80%, warn >= 80%, critical >= 95%, blocked = cap reached"
        monthResetsAt:
          {
            type: string,
            format: date-time,
            description: "Start of next UTC month, when the spend counter resets",
          }
        alertsSent:
          type: array
          description: >
            One-time admin threshold alert emails (80/95/100% of the cap)
            already dispatched this UTC month, read from the exactly-once
            cost_cap_notifications stamps. Lets staff see the escalation
            already happened without pinging admins again.
          items:
            $ref: "#/components/schemas/CostCapAlertSent"

    CostCapAlertSent:
      type: object
      required: [thresholdPercent, sentAt]
      properties:
        thresholdPercent:
          type: integer
          description: "Threshold crossed when the alert was sent: 80, 95, or 100 (percent of the monthly cap)"
        sentAt:
          {
            type: string,
            format: date-time,
            description: "When the admin alert email was dispatched",
          }

    CompanySpendUserRow:
      type: object
      required: [userId, displayName, costUsd, runs, sharePercent]
      properties:
        userId: { type: string, format: uuid }
        displayName:
          type: string
          description: "The staff member's display name (falls back to email, then a short id)"
        email:
          type: string
          nullable: true
        costUsd:
          {
            type: number,
            description: "Month-to-date LLM spend for this user (USD)",
          }
        runs:
          {
            type: integer,
            description: "Engine runs recorded this month for this user",
          }
        sharePercent:
          type: number
          description: "This user's share of the company-wide month-to-date spend, 0-100"

    CompanySpendByUser:
      type: object
      description: >
        Who is consuming the shared monthly LLM budget. Same SUM over
        harness_engine_runs.cost_usd for the current UTC month that the
        company-wide meter and the requireCostBudget gate use, grouped by
        user and sorted by spend (highest first). Only users with at least
        one run this month appear.
      required: [totalUsd, capUsd, monthResetsAt, users]
      properties:
        totalUsd:
          {
            type: number,
            description: "Company-wide month-to-date spend (USD) — the sum of all rows",
          }
        capUsd: { type: number, description: "The shared monthly cap (USD)" }
        monthResetsAt:
          {
            type: string,
            format: date-time,
            description: "Start of next UTC month",
          }
        users:
          type: array
          items: { $ref: "#/components/schemas/CompanySpendUserRow" }

