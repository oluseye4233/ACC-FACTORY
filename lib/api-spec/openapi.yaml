openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ATANDA Command Centre + HARNESS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: me
  - name: sessions
  - name: artifacts
  - name: harness
  - name: billing
  - name: pricing
  - name: admin
  - name: cron
  - name: verify
  - name: exemplars
  - name: prompts
  - name: badges
  - name: export

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Basic liveness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health:
    get:
      operationId: healthDeep
      tags: [health]
      summary: Deep health (db + engines)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeepHealth" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current authenticated user + subscriber
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/usage:
    get:
      operationId: getMyUsage
      tags: [me]
      summary: Token + cost usage for the calling user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [me]
      summary: Update the calling user's display name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/export:
    get:
      operationId: exportMyData
      tags: [me]
      summary: Download a JSON bundle of all of the user's account data (GDPR portability)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDataExport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/delete:
    post:
      operationId: deleteMyAccount
      tags: [me]
      summary: Permanently delete the calling user's account and all associated data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountInput" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteAccountResult" }
        "400":
          description: Confirmation phrase missing or incorrect
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessSession" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
    delete:
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Deleted

  /me/context-craft-badges:
    get:
      operationId: listMyContextCraftBadges
      tags: [me]
      summary: List the 7 Context Craft pillar mini-quest badges (earned + locked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContextCraftBadge" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}/ingestion:
    get:
      operationId: getSessionIngestion
      tags: [sessions]
      summary: Get the ingestion record linked to this session (404 if origin=manual)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}:
    get:
      operationId: getIngestion
      tags: [sessions]
      summary: Fetch a previously-ingested document by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}/start-session:
    post:
      operationId: startSessionFromIngestion
      tags: [sessions]
      summary: Create a HARNESS session seeded from an ingested document
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestStartSessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/feature-state:
    get:
      operationId: listFeatureState
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureState" }

  /sessions/{id}/artifacts:
    get:
      operationId: listSessionArtifacts
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessArtifact" }

  /artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/f1:
    post:
      operationId: harnessF1
      tags: [harness]
      summary: ATLAS Prompt Diagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF1Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptDiagnostic" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /harness/f2:
    post:
      operationId: harnessF2
      tags: [harness]
      summary: Atomic Prompt Builder certification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF2Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtomicPrompt" }

  /harness/f3:
    post:
      operationId: harnessF3Stream
      tags: [harness]
      summary: CELL MA Builder (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF3Input" }
      responses:
        "200":
          description: text/event-stream of MA cultivation events
          content:
            text/event-stream:
              schema: { type: string }

  /harness/f4:
    post:
      operationId: harnessF4
      tags: [harness]
      summary: Micro PDD converter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF4Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroPdd" }

  /harness/f5:
    post:
      operationId: harnessF5
      tags: [harness]
      summary: SPC Builder (FORGE Q&A turn)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF5Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F5StepOutcome" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f6:
    post:
      operationId: harnessF6
      tags: [harness]
      summary: ATLAS PDD Drafter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF6Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtlasPdd" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/f6-vdj:
    post:
      operationId: harnessF6Vdj
      tags: [harness]
      summary: VIBE DJ recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF6VdjInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VdjRecommendation" }
        "403":
          description: Tier insufficient (requires Practitioner+)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /harness/f7:
    post:
      operationId: harnessF7Stream
      tags: [harness]
      summary: SPARTAN Compressor (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF7Input" }
      responses:
        "200":
          description: text/event-stream of SPARTAN 7-step events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /harness/escalations/stream:
    get:
      operationId: harnessEscalationsStream
      tags: [harness]
      summary: SSE feed of escalations for a session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /billing/checkout:
    post:
      operationId: billingCheckout
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }

  /billing/portal:
    post:
      operationId: billingPortal
      tags: [billing]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSession" }

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook receiver (raw body)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StripeWebhookPayload" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /pricing:
    get:
      operationId: getPricing
      tags: [pricing]
      summary: Public pricing content
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPayload" }

  /admin/pricing:
    put:
      operationId: putPricing
      tags: [admin]
      summary: Replace pricing payload (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingPayload" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPayload" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /cron/reset-harness-limits:
    post:
      operationId: cronResetHarnessLimits
      tags: [cron]
      summary: Reset daily harness counters (requires CRON_SECRET header)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exemplars:
    get:
      operationId: listExemplars
      tags: [exemplars]
      summary: List canonical and hand-authored SPC / PDD exemplars
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExemplarSummary" }

  /exemplars/{id}:
    get:
      operationId: getExemplar
      tags: [exemplars]
      summary: Fetch a single exemplar including its full markdown body
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exemplar" }
        "404":
          $ref: "#/components/responses/NotFound"

  /me/prompts:
    get:
      operationId: listMyPrompts
      tags: [prompts]
      summary: Paginated personal prompt library (atomic prompts, diagnostics, SPCs)
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [ATOMIC_PROMPT, PROMPT_DIAGNOSTIC, SPC] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptLibraryPage" }

  /me/spcs/export.csv:
    get:
      operationId: exportMySpcsCsv
      tags: [export]
      summary: Download all of the user's SPCs in 33-column BI_SPC_ALPHA CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /me/spcs/export.pdf:
    get:
      operationId: exportMySpcsPdf
      tags: [export]
      summary: Download all of the user's SPCs as a printable PDF report
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /me/badges:
    get:
      operationId: listMyBadges
      tags: [badges]
      summary: Compute current Quest Badge progress (ASPE / AISA / AISE)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BadgeProgress" }

  /me/badges/aise/claim:
    post:
      operationId: claimAiseBadge
      tags: [badges]
      summary: Submit URL evidence for AISE (verified against domain allowlist + reachability)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiseClaimInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BadgeProgress" }
        "422":
          description: No verifiable evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /harness/evolve:
    post:
      operationId: harnessEvolve
      tags: [harness]
      summary: DE-SPC — synthesise a Digitally Evolved SPC from N MA birth packages (requires ASPE badge)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessEvolveInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /verify:
    get:
      operationId: verifyCertificate
      tags: [verify]
      parameters:
        - name: cert
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResult" }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Forbidden (tier or role gate)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    DeepHealth:
      type: object
      required: [status, db, engines]
      properties:
        status: { type: string }
        db: { type: string, enum: [ok, error] }
        engines: { type: string, enum: [ok, degraded, error] }
        version: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    StripeWebhookPayload:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: ["string", "null"] }

    SubscriberTier:
      type: string
      enum: [EXPLORER, PRACTITIONER, ARCHITECT, INSTITUTION]

    CertTier:
      type: string
      enum: [BRONZE, SILVER, GOLD, PLATINUM, NONE]

    FeatureStatus:
      type: string
      enum: [LOCKED, AVAILABLE, IN_PROGRESS, COMPLETE]

    ArtifactType:
      type: string
      enum:
        - PROMPT_DIAGNOSTIC
        - ATOMIC_PROMPT
        - MA_BIRTH_PACKAGE
        - MICRO_PDD
        - SPC
        - ATLAS_PDD
        - MVP_PDD

    Subscriber:
      type: object
      required: [tier, status]
      properties:
        tier: { $ref: "#/components/schemas/SubscriberTier" }
        status: { type: string }
        currentPeriodEnd: { type: ["string", "null"], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        usage:
          type: object
          required: [f1, f2, f3, f4, f5, f6, f7]
          properties:
            f1: { type: integer }
            f2: { type: integer }
            f3: { type: integer }
            f4: { type: integer }
            f5: { type: integer }
            f6: { type: integer }
            f7: { type: integer }

    MeResponse:
      type: object
      required: [id, clerkUserId, role, subscriber]
      properties:
        id: { type: string, format: uuid }
        clerkUserId: { type: string }
        email: { type: ["string", "null"] }
        displayName: { type: ["string", "null"] }
        role: { type: string }
        subscriber: { $ref: "#/components/schemas/Subscriber" }

    UsageWindow:
      type: object
      required: [totalTokens, totalCostUsd]
      properties:
        totalTokens: { type: integer }
        totalCostUsd: { type: number }

    UsageByEngine:
      type: object
      required: [engineId, runs, totalTokens, totalCostUsd]
      properties:
        engineId: { type: integer }
        runs: { type: integer }
        totalTokens: { type: integer }
        totalCostUsd: { type: number }

    UsageReport:
      type: object
      required: [day, month, byEngine]
      properties:
        day: { $ref: "#/components/schemas/UsageWindow" }
        month: { $ref: "#/components/schemas/UsageWindow" }
        byEngine:
          type: array
          items: { $ref: "#/components/schemas/UsageByEngine" }

    UpdateProfileInput:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }

    DeleteAccountInput:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must be exactly "DELETE" to proceed.

    DeleteAccountResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        deletedAt: { type: string, format: date-time }

    MyDataExport:
      type: object
      required: [exportedAt, user, subscriber, sessions, artifacts, badges, engineRunCount]
      properties:
        exportedAt: { type: string, format: date-time }
        user:
          type: object
          additionalProperties: true
        subscriber:
          type: object
          additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: true
        badges:
          type: array
          items:
            type: object
            additionalProperties: true
        engineRunCount: { type: integer }

    HarnessSession:
      type: object
      required: [id, sessionName, status, origin, ingestionId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sessionName: { type: string }
        status: { type: string }
        origin: { type: string, enum: [manual, ingested] }
        ingestionId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IngestionDocument:
      type: object
      required:
        [id, originalFilename, mimeType, fileSizeBytes, sourceDocKind,
         extractedTextChars, summary, seedPrompt, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalFilename: { type: string }
        mimeType: { type: string }
        fileSizeBytes: { type: integer }
        sourceDocKind:
          type: string
          enum: [product_design_document, software_design_document, concept_note, spec_sheet, other]
        detectedTitle: { type: string, nullable: true }
        extractedTextChars: { type: integer }
