    ExemplarSummary:
      type: object
      required: [id, title, tagline, jcse, certClass, source, kind, sku, disc]
      properties:
        id: { type: string }
        title: { type: string }
        tagline: { type: string }
        jcse: { type: ["integer", "null"] }
        certClass: { type: ["string", "null"] }
        sku: { type: string }
        source:
          type: string
          enum: [canonical, hand_authored, generated]
        kind:
          type: string
          enum: [SPC, PDD]
        disc:
          type: ["string", "null"]
          description: "DISC personality profile (Dominance / Influence / Steadiness / Conscientiousness). Every SPC has a unique DISC fingerprint; PDDs are null."

    Exemplar:
      allOf:
        - $ref: "#/components/schemas/ExemplarSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    PromptLibraryItem:
      type: object
      required: [id, sessionId, artifactType, preview, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        sessionName: { type: ["string", "null"] }
        artifactType: { $ref: "#/components/schemas/ArtifactType" }
        certTier: { type: ["string", "null"] }
        jcseScore: { type: ["integer", "null"] }
        spcOrigin: { type: ["string", "null"], enum: [artisanal, digitally_evolved, null] }
        preview: { type: string }
        createdAt: { type: string, format: date-time }

    PromptLibraryPage:
      type: object
      required: [page, pageSize, total, items]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/PromptLibraryItem" }

    BadgeProgress:
      type: object
      required:
        [
          badgeId,
          status,
          eligible,
          progress,
          requirements,
          evidence,
          unlockedAt,
          claimedAt,
          revokedAt,
          revokedReason,
          revocationCount,
          restoredAt,
          restoredNote,
        ]
      properties:
        badgeId: { type: string, enum: [ASPE, AISA, AISE, AISA_PWDD, AISE_BUILD] }
        status: { type: string, enum: [LOCKED, UNLOCKED, CLAIMED, REVOKED] }
        eligible: { type: boolean }
        progress: { type: object, additionalProperties: { type: integer } }
        requirements: { type: object, additionalProperties: { type: integer } }
        evidence: { type: object, additionalProperties: true }
        unlockedAt: { type: ["string", "null"], format: date-time }
        claimedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        revokedReason: { type: ["string", "null"] }
        revocationCount: { type: integer, minimum: 0 }
        restoredAt: { type: ["string", "null"], format: date-time }
        restoredNote: { type: ["string", "null"] }

    JstInput:
      type: object
      required: [jobsScore, skillsScore, talentScore]
      properties:
        jobsScore: { type: integer, minimum: 1, maximum: 10, description: "Jobs — paid work / market demand for what you do (1-10)." }
        skillsScore: { type: integer, minimum: 1, maximum: 10, description: "Skills — learned, practised capability (1-10)." }
        talentScore: { type: integer, minimum: 1, maximum: 10, description: "Talent — innate edge / natural advantage (1-10)." }
        notes: { type: string, maxLength: 2000 }

    JstAssessment:
      type: object
      required: [id, jobsScore, skillsScore, talentScore, composite, band, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        jobsScore: { type: integer }
        skillsScore: { type: integer }
        talentScore: { type: integer }
        composite: { type: number, description: "0-100 derived composite." }
        band: { type: string, enum: [SEEKER, BUILDER, OPERATOR, ASCENDANT] }
        source:
          type: string
          enum: [self_assessment, ark_onecraft]
          description: "Where the score came from: in-app self-assessment or the ARK.ONECRAFT platform."
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    JstSummary:
      type: object
      required: [latest, history, count]
      properties:
        latest: { oneOf: [{ $ref: "#/components/schemas/JstAssessment" }, { type: "null" }] }
        history:
          type: array
          items: { $ref: "#/components/schemas/JstAssessment" }
        count: { type: integer, minimum: 0 }

    ReaderCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }

    OnboardingState:
      type: object
      required: [track, readerCode, startedAt]
      properties:
        track: { type: string, enum: [default, atomic_prompt_v1] }
        readerCode: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }

    AscensionRung:
      type: object
      required: [index, key, title, role, engine, chapter, blurb, complete, current, progress, target, actionLabel, actionHref]
      properties:
        index: { type: integer, description: "0-based position on the ladder." }
        key: { type: string, description: "Stable rung identifier." }
        title: { type: string, description: "Badge / rung name." }
        role: { type: string, description: "Operator persona earned at this rung." }
        engine: { type: string, description: "Platform action / engine that proves the rung." }
        chapter: { type: string, description: "Anchor in The Atomic Prompt." }
        blurb: { type: string }
        complete: { type: boolean }
        current: { type: boolean, description: "The next incomplete rung — the reader's focus." }
        progress: { type: integer, minimum: 0 }
        target: { type: integer, minimum: 1 }
        actionLabel: { type: string }
        actionHref: { type: string }

    AscensionJourney:
      type: object
      required: [track, readerCode, completedCount, totalCount, band, rungs]
      properties:
        track: { type: string, enum: [default, atomic_prompt_v1] }
        readerCode: { type: ["string", "null"] }
        completedCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 1 }
        band: { type: ["string", "null"], enum: [SEEKER, BUILDER, OPERATOR, ASCENDANT, null] }
        rungs:
          type: array
          items: { $ref: "#/components/schemas/AscensionRung" }

    AiseClaimInput:
      type: object
      properties:
        spcDnaAgentUrl: { type: string, format: uri }
        gptUrl: { type: string, format: uri }
        copilotUrl: { type: string, format: uri }
        nativeAppUrl: { type: string, format: uri }
        notes: { type: string }

    EngineerClaimInput:
      type: object
      required: [url, evidenceNote]
      properties:
        url: { type: string, format: uri }
        evidenceNote: { type: string, minLength: 1, maxLength: 500 }
        sessionId: { type: string, format: uuid }

    AdminRevokeBadgeInput:
      type: object
      required: [userId, badgeId, reason]
      properties:
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    AdminRevokeBadgeResult:
      type: object
      required: [ok, userId, badgeId, revokedAt, reason, revocationCount]
      properties:
        ok: { type: boolean }
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        revokedAt: { type: string, format: date-time }
        reason: { type: string }
        revocationCount: { type: integer, minimum: 1 }

    AdminRestoreBadgeInput:
      type: object
      required: [userId, badgeId]
      properties:
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        note: { type: string, maxLength: 1000 }

    AdminRestoreBadgeResult:
      type: object
      required: [ok, userId, badgeId, restoredAt, status, revocationCount]
      properties:
        ok: { type: boolean }
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        restoredAt: { type: string, format: date-time }
        status: { type: string, enum: [CLAIMED] }
        revocationCount: { type: integer, minimum: 0 }
        note: { type: string, nullable: true }

    BadgeRevocationParty:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true

    BadgeRevocationEntry:
      type: object
      required: [id, badgeId, reason, revokedAt, admin, target]
      properties:
        id: { type: string, format: uuid }
        badgeId: { type: string }
        reason: { type: string }
        revokedAt: { type: string, format: date-time }
        admin: { $ref: "#/components/schemas/BadgeRevocationParty" }
        target: { $ref: "#/components/schemas/BadgeRevocationParty" }

    AdminBadgeRevocationPreviewEntry:
      type: object
      required: [revokedAt, reason]
      properties:
        revokedAt: { type: string, format: date-time }
        revokedByUserId:
          type: string
          format: uuid
          nullable: true
        reason: { type: string }

    AdminBadgeRevocationPreview:
      type: object
      required: [userId, badgeId, badgeExists, currentStatus, revocationCount, history]
      properties:
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        badgeExists: { type: boolean }
        currentStatus:
          type: string
          enum: [LOCKED, UNLOCKED, CLAIMED, REVOKED]
          nullable: true
        revocationCount: { type: integer, minimum: 0 }
        lastRevokedAt:
          type: string
          format: date-time
          nullable: true
        lastReason:
          type: string
          nullable: true
        history:
          type: array
          items: { $ref: "#/components/schemas/AdminBadgeRevocationPreviewEntry" }

    AdminBadgeRevocationsList:
      type: object
      required: [revocations]
      properties:
        revocations:
          type: array
          items: { $ref: "#/components/schemas/BadgeRevocationEntry" }

    HarnessEvolveInput:
      type: object
      required: [sessionId, maArtifactIds]
      properties:
        sessionId: { type: string, format: uuid }
        maArtifactIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 2
          maxItems: 12
        provider: { $ref: "#/components/schemas/LlmProvider" }
