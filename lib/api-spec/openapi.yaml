      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true

    BadgeRevocationEntry:
      type: object
      required: [id, badgeId, reason, revokedAt, admin, target]
      properties:
        id: { type: string, format: uuid }
        badgeId: { type: string }
        reason: { type: string }
        revokedAt: { type: string, format: date-time }
        admin: { $ref: "#/components/schemas/BadgeRevocationParty" }
        target: { $ref: "#/components/schemas/BadgeRevocationParty" }

    AdminBadgeRevocationPreviewEntry:
      type: object
      required: [revokedAt, reason]
      properties:
        revokedAt: { type: string, format: date-time }
        revokedByUserId:
          type: string
          format: uuid
          nullable: true
        reason: { type: string }

    AdminBadgeRevocationPreview:
      type: object
      required:
        [userId, badgeId, badgeExists, currentStatus, revocationCount, history]
      properties:
        userId: { type: string, format: uuid }
        badgeId: { type: string, enum: [AISE, AISE_BUILD] }
        badgeExists: { type: boolean }
        currentStatus:
          type: string
          enum: [LOCKED, UNLOCKED, CLAIMED, REVOKED]
          nullable: true
        revocationCount: { type: integer, minimum: 0 }
        lastRevokedAt:
          type: string
          format: date-time
          nullable: true
        lastReason:
          type: string
          nullable: true
        history:
          type: array
          items:
            { $ref: "#/components/schemas/AdminBadgeRevocationPreviewEntry" }

    AdminBadgeRevocationsList:
      type: object
      required: [revocations]
      properties:
        revocations:
          type: array
          items: { $ref: "#/components/schemas/BadgeRevocationEntry" }

    CronTargetStatus:
      type: object
      required:
        [
          target,
          label,
          schedule,
          expectedIntervalMinutes,
          staleAfterMinutes,
          firstSeenAt,
          lastTickAt,
          tickCount,
          neverTicked,
          minutesSinceLastTick,
          stale,
          recentTicks,
          ticksLast24h,
          expectedTicksLast24h,
        ]
      properties:
        target: { type: string }
        label: { type: string }
        schedule: { type: string }
        expectedIntervalMinutes: { type: integer }
        staleAfterMinutes: { type: integer }
        firstSeenAt: { type: string, format: date-time, nullable: true }
        lastTickAt: { type: string, format: date-time, nullable: true }
        tickCount: { type: integer }
        neverTicked: { type: boolean }
        minutesSinceLastTick: { type: integer, nullable: true }
        stale: { type: boolean }
        recentTicks:
          type: array
          description: Most recent tick timestamps (newest first), bounded window.
          items: { type: string, format: date-time }
        ticksLast24h:
          type: integer
          description: Ticks observed in the trailing 24h window.
        expectedTicksLast24h:
          type: integer
          description: Ticks the schedule should produce in 24h (0 for schedules coarser than daily).

    AdminCronStatus:
      type: object
      required: [generatedAt, targets]
      properties:
        generatedAt: { type: string, format: date-time }
        targets:
          type: array
          items: { $ref: "#/components/schemas/CronTargetStatus" }

    HarnessEvolveInput:
      type: object
      required: [sessionId, maArtifactIds]
      properties:
        sessionId: { type: string, format: uuid }
        maArtifactIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 2
          maxItems: 12
        provider: { $ref: "#/components/schemas/LlmProvider" }

    SpcDraftCheatSheet:
      type: object
      additionalProperties: false
      required:
        [generalDefinition, generalProductionProcess, environmentNotes, thirdPartyDefinitions, publishedBy]
      properties:
        generalDefinition:
          type: object
          additionalProperties: false
          required: [mission, skillSet, useCases]
          properties:
            mission: { type: string }
            skillSet:
              type: array
              items: { type: string }
            useCases:
              type: array
              items: { type: string }
        generalProductionProcess:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [step, description]
            properties:
              step: { type: integer }
              description: { type: string }
        environmentNotes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [environment, note, status]
            properties:
              environment: { type: string }
              note: { type: string }
              status: { type: string, enum: [sketch, verified_integration] }
        thirdPartyDefinitions:
          nullable: true
          type: array
          items: { type: string }
        publishedBy: { type: string, enum: [sphinx_engine] }

    SpcLibraryCard:
      type: object
      additionalProperties: false
      required:
        [id, slug, name, provenance, status, preBuild, cheatSheetPublished, cheatSheet, thirdPartyDefinitions]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        provenance:
          type: object
          additionalProperties: false
          required: [source, version, status]
          properties:
            source: { type: string }
            version: { type: string }
            status: { type: string }
            exemplarId: { type: string }
            marketplace: { type: string, enum: [curated, open] }
            tagline: { type: string }
            searchText:
              {
                type: string,
                description: Search-only excerpt used for deterministic Capability Brief matching,
              }
        status: { type: string, enum: [PRE_BUILD] }
        preBuild: { type: boolean }
        cheatSheetPublished: { type: boolean }
        cheatSheet:
          allOf:
            - $ref: "#/components/schemas/SpcDraftCheatSheet"
          nullable: true
        thirdPartyDefinitions:
          nullable: true
          type: array
          items: { type: string }

    SpcDevKit:
      type: object
      additionalProperties: false
      required: [id, name, cardIds, cards, registrationNote, executes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, enum: ["SPC Dev Kit"] }
        cardIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 6
          maxItems: 6
        cards:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: "#/components/schemas/SpcLibraryCard" }
        registrationNote: { type: string }
        executes:
          type: boolean
          enum: [false]

    CreateSpcPlayerRunInput:
      type: object
      additionalProperties: false
      required: [title, brief, selectedCardIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        brief: { type: string, minLength: 1, maxLength: 100000 }
        selectedCardIds:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items: { type: string, format: uuid }
        sourceArtifactId:
          type: string
          format: uuid
          description: Optional owned project artifact used as the run's primary context.
        profile:
          type: string
          enum: [full, rapid]
          default: full

    ExecuteSpcPlayerRunInput:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [claude, openai, gemini, deepseek, kimi, qwen, glm]

    SpcPlayerScores:
      type: object
      additionalProperties: false
      description: Independent nullable 0-100 axes only; composite scores are prohibited.
      properties:
        clarity: { type: ["number", "null"], minimum: 0, maximum: 100 }
        truthfulness: { type: ["number", "null"], minimum: 0, maximum: 100 }
        detectability: { type: ["number", "null"], minimum: 0, maximum: 100 }

    SpcPlayerStageResult:
      type: object
      additionalProperties: false
      required: [stageIndex, cardId, cardSlug, invoked, verdict, content, evidence]
      properties:
        stageIndex: { type: integer, minimum: 0 }
        cardId: { type: string, format: uuid }
        cardSlug: { type: string }
        invoked: { type: boolean, enum: [true] }
        verdict: { type: string }
        content: { type: string }
        evidence:
          type: array
          items: { type: string }
        completedAt: { type: ["string", "null"], format: date-time }

    SpcPlayerGovernanceEvaluation:
      type: object
      additionalProperties: false
      required: [kind, invoked, verdict, content, evidence, scores, completedAt]
      properties:
        kind: { type: string, enum: [governance_evaluation] }
        invoked: { type: boolean, enum: [true] }
        verdict: { type: string }
        content: { type: string }
        evidence:
          type: array
          items: { type: string }
        scores: { $ref: "#/components/schemas/SpcPlayerScores" }
        completedAt: { type: string, format: date-time }

    SpcPlayerExecutionAdvisory:
      type: object
      additionalProperties: false
      required: [authority, status, profile, invokedStages, governanceEvaluationInvoked, evidenceTrail, distribution]
      properties:
        authority:
          type: string
          enum: ["user-authorized REVERB v3 derivation"]
        status: { type: string, enum: [PRE_BUILD] }
        profile: { type: string, enum: [full, rapid] }
        invokedStages:
          type: array
          items: { type: integer, minimum: 0 }
        governanceEvaluationInvoked: { type: boolean }
        evidenceTrail:
          type: array
          items: { type: string }
        distribution:
          type: string
          enum: ["plan-only; no connector invoked"]

    SpcPlayerDistributionPlan:
      type: object
      additionalProperties: false
      required: [status, connectorInvoked, externalSend]
      properties:
        status: { type: string, enum: [plan_only] }
        connectorInvoked: { type: boolean, enum: [false] }
        externalSend: { type: boolean, enum: [false] }

    SpcPlayerOutputPackage:
      type: object
      additionalProperties: false
      description: Completed SPC content plus its non-detachable advisory.
      required: [content, governanceEvaluation, advisory, scores, distributionPlan]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/SpcPlayerStageResult" }
        advisory: { $ref: "#/components/schemas/SpcPlayerExecutionAdvisory" }
        governanceEvaluation: { $ref: "#/components/schemas/SpcPlayerGovernanceEvaluation" }
        scores: { $ref: "#/components/schemas/SpcPlayerScores" }
        distributionPlan: { $ref: "#/components/schemas/SpcPlayerDistributionPlan" }

    SpcPlayerGovernance:
      type: object
      additionalProperties: false
      required: [specVersion, source, scorePolicy]
      properties:
        specVersion: { type: string, enum: ["v4.0"] }
        source: { type: string }
        scorePolicy:
          type: object
          additionalProperties: false
          required: [axes]
          properties:
            axes:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: string
                enum: [clarity, truthfulness, detectability]

    SpcPlayerRun:
      type: object
      additionalProperties: false
      required:
        [id, ownerUserId, title, brief, selectedCardIds, profile, status, executionState, canExecute, retryAvailableAt, governance, stageResults, governanceEvaluation, executionAdvisory, distributionPlan, error, transitions, completedAt, outputPackage, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        sourceArtifactId: { type: ["string", "null"], format: uuid }
        title: { type: string }
        brief: { type: string }
        selectedCardIds:
          type: array
          items: { type: string, format: uuid }
        profile: { type: string, enum: [full, rapid] }
        status: { type: string, enum: [DRAFT, RUNNING, COMPLETED, FAILED] }
        executionState:
          type: string
          enum: [IDLE, ACTIVE, RECOVERABLE, FINISHED]
          description: Public execution availability without internal attempt credentials.
        canExecute:
          type: boolean
          description: Whether a new execution attempt may be claimed now.
        retryAvailableAt:
          type: ["string", "null"]
          format: date-time
          description: When an active or expired interrupted attempt becomes retryable; null for immediate legacy recovery and non-running states.
        governance: { $ref: "#/components/schemas/SpcPlayerGovernance" }
        stageResults:
          type: array
          items: { $ref: "#/components/schemas/SpcPlayerStageResult" }
        governanceEvaluation:
          allOf:
            - $ref: "#/components/schemas/SpcPlayerGovernanceEvaluation"
          nullable: true
        executionAdvisory:
          type: ["object", "null"]
          allOf:
            - $ref: "#/components/schemas/SpcPlayerExecutionAdvisory"
        distributionPlan:
          allOf:
            - $ref: "#/components/schemas/SpcPlayerDistributionPlan"
        error: { type: ["string", "null"] }
        transitions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [from, to, at]
            properties:
              from: { type: string }
              to: { type: string }
              at: { type: string, format: date-time }
              reason: { type: string }
        completedAt: { type: ["string", "null"], format: date-time }
        outputPackage:
          allOf:
            - $ref: "#/components/schemas/SpcPlayerOutputPackage"
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SpcPlayerManifest:
      type: object
      additionalProperties: false
      required: [manifestVersion, run, governance, capabilities]
      properties:
        manifestVersion: { type: string, enum: ["spc-player-manifest-v2"] }
        run: { $ref: "#/components/schemas/SpcPlayerRun" }
        governance: { $ref: "#/components/schemas/SpcPlayerGovernance" }
        capabilities:
          type: object
          additionalProperties: false
          required: [connectors, actions, formats, entitlement]
          properties:
            connectors:
              type: array
              items: { type: string, enum: [download, webhook] }
            actions:
              type: array
              items: { type: string, enum: [execute, deliver] }
            formats:
              type: array
              items: { type: string, enum: [json] }
            entitlement:
              type: string
              enum: [open_access]

    SpcPlayerWebhookAuthorizationInput:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint:
          type: string
          format: uri
          description: Public HTTPS webhook destination; credentials are not accepted or stored.

    SpcPlayerWebhookAuthorization:
      type: object
      additionalProperties: false
      required: [connector, endpoint, authorizedAt]
      properties:
        connector: { type: string, enum: [webhook] }
        endpoint: { type: string, format: uri }
        authorizedAt: { type: string, format: date-time }

    SpcPlayerWebhookAuthorizationStatus:
      type: object
      additionalProperties: false
      required: [authorized, connector, endpoint, authorizedAt]
      properties:
        authorized: { type: boolean }
        connector: { type: string, enum: [webhook] }
        endpoint: { type: ["string", "null"], format: uri }
        authorizedAt: { type: ["string", "null"], format: date-time }

    SpcPlayerDeliveryResult:
      type: object
      additionalProperties: false
      required: [runId, connector, deliveredAt, statusCode]
      properties:
        runId: { type: string, format: uuid }
        connector: { type: string, enum: [webhook] }
        deliveredAt: { type: string, format: date-time }
        statusCode: { type: integer, minimum: 200, maximum: 299 }
