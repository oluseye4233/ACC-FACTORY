        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createF0Engagement
      tags: [f0]
      summary: Open an F0 engagement (starts in DISCOVERY)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateF0EngagementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F0Engagement" }

