    post:
      operationId: harnessF9Mecha
      tags: [harness]
      summary: Run the deterministic F9 MECHA Machine Floor
      description: >
        Accepts an F8 CODEBASE_BUNDLE whose MVP PDD lineage is SPARTAN-certified.
        All seven phases and immutable external gate evidence must be supplied in
        order. Missing, non-passing, or unverifiable evidence produces a cited
        refusal; MECHA never invents or overrides a gate verdict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF9Input" }
      responses:
        "200":
          description: Existing signed Machine Artifact returned for an idempotent repeat submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F9MachineArtifact" }
        "201":
          description: Signed Machine Artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F9MachineArtifact" }
        "400":
          description: Invalid phase envelope
        "409":
          description: Upstream F8/SPARTAN prerequisite failed
        "422":
          description: Cited MECHA refusal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F9Refusal" }
