openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ATANDA Command Centre + HARNESS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: me
  - name: sessions
  - name: artifacts
  - name: harness
  - name: billing
  - name: pricing
  - name: admin
  - name: cron
  - name: verify
  - name: exemplars
  - name: prompts
  - name: badges
  - name: export
  - name: f1000
  - name: magnet

paths:
  /f10/catalog:
    get:
      operationId: getF10Catalog
      tags: [f10]
      summary: Honest F10 export families, targets, and delivery modes
      responses:
        "200":
          description: F10 catalog
          content: { application/json: { schema: { $ref: "#/components/schemas/F10Catalog" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /f10/colonization-runs:
    get:
      operationId: listF10ColonizationRuns
      tags: [f10]
      summary: List cited, fail-closed SAVANT CONNECTOR colonization runs
      responses:
        "200":
          description: Colonization runs
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/F10ColonizationRun" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createF10ColonizationRun
      tags: [f10]
      summary: Record and evaluate an F10 colonization protocol run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/F10ColonizationInput" } } }
      responses:
        "201": { description: Recorded run (promotion is unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/F10ColonizationRun" } } } }
        "400": { description: Invalid intake envelope }
  /f10/colonization-runs/{id}:
    get:
      operationId: getF10ColonizationRun
      tags: [f10]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Colonization run, content: { application/json: { schema: { $ref: "#/components/schemas/F10ColonizationRun" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /f10/colonization-runs/{id}/promote:
    post:
      operationId: promoteF10ColonizationRun
      tags: [f10]
      summary: Attempt an exact-write-bound F10 promotion
      description: Fails closed until the server-owned Vault adapter is available. A caller-provided handle never establishes Vault readiness.
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/F10ColonizationPromotionInput" } } }
      responses:
        "200": { description: "Promoted only after all certification, consent, and Vault gates pass", content: { application/json: { schema: { $ref: "#/components/schemas/F10ColonizationRun" } } } }
        "400": { description: Invalid promotion envelope }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Staging, certificate, one-time consent, deployment-subject, or Vault gate refused promotion" }
  /f10/sources:
    get:
      operationId: listF10Sources
      tags: [f10]
      summary: List owned artifacts eligible for F10 exports
      responses:
        "200":
          description: Eligible owned sources
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/F10Source" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /f10/exports/manifest:
    post:
      operationId: createF10ExportManifest
      tags: [f10]
      summary: Create a deterministic F10 export manifest from an owned artifact
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/F10ExportInput" } } }
      responses:
        "200": { description: Deterministic export manifest, content: { application/json: { schema: { $ref: "#/components/schemas/F10ExportManifest" } } } }
        "400": { description: Invalid source or profile }
  /f10/exports/download:
    post:
      operationId: downloadF10Export
      tags: [f10]
      summary: Download a deterministic F10 ZIP export
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/F10ExportInput" } } }
      responses:
        "200":
          description: ZIP export
          content: { application/zip: { schema: { type: string, format: binary } } }
        "400": { description: Invalid source or profile }
  /f10/exports/github:
    post:
      operationId: pushF10ExportToGitHub
      tags: [f10]
      summary: Rebuild and push an owned F10 handoff to an authorized GitHub repository
      description: File bytes are reconstructed from the owned source artifact and selected profile; caller-supplied files are not accepted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/F10GitHubPushInput" } } }
      responses:
        "200": { description: Durable GitHub push result, content: { application/json: { schema: { $ref: "#/components/schemas/F10GitHubPushResult" } } } }
        "400": { description: "Invalid source, profile, repository, or branch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: GitHub is not connected }
  /f10/destinations:
    get:
      operationId: listF10Destinations
      tags: [f10]
      summary: List tenant-scoped release destinations
      responses:
        "200":
          description: Destinations visible to the current operator
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/F10Destination" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createF10Destination
      tags: [f10]
      summary: Register an authorized HTTPS release destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/F10DestinationRequest" }
      responses:
        "201":
          description: Destination registered
          content: { application/json: { schema: { $ref: "#/components/schemas/F10Destination" } } }
        "400": { description: Invalid or unsafe destination }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /f10/connections:
    get:
      operationId: listF10ProviderConnections
      tags: [f10]
      summary: List provider authorization references (credential values are never returned)
      responses:
        "200": { description: Connections, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/F10ProviderConnection" } } } } }
  /f10/connections/authorize:
    post:
      operationId: authorizeF10ProviderConnection
      tags: [f10]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/F10ProviderAuthorizeRequest" } } } }
      responses: { "200": { description: Provider OAuth/broker authorization URL or deterministic fallback } }
  /f10/connections/callback:
    get:
      operationId: f10ProviderConnectionCallback
      tags: [f10]
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses: { "302": { description: Redirect to F10 UI after callback } }
  /f10/connections/{id}/revoke:
    post:
      operationId: revokeF10ProviderConnection
      tags: [f10]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Revoked connection } }
  /f10/deployments:
    get:
      operationId: listF10BundleDeployments
      tags: [f10]
      responses: { "200": { description: Deployment history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/F10BundleDeployment" } } } } } }
    post:
      operationId: createF10BundleDeployment
      tags: [f10]
      summary: Generate a server-owned provider bundle and queue one deployment release
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/F10BundleDeploymentRequest" } } } }
      responses:
        "201": { description: Queued deployment release }
        "200": { description: Deterministic export fallback when unconfigured }
  /f10/deployments/{id}:
    get:
      operationId: getF10BundleDeployment
      tags: [f10]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Deployment, attempts, receipt, and audit history
          content: { application/json: { schema: { $ref: "#/components/schemas/F10BundleDeploymentDetail" } } }
  /f10/deployments/{id}/process:
    post:
      operationId: processF10BundleDeployment
      tags: [f10]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202": { description: Submitted to provider transport }
        "409": { description: "Provider unconfigured, revoked, or not accepted; deterministic export fallback applies" }
  /f10/deployments/{id}/reconcile:
    post:
      operationId: reconcileF10BundleDeployment
      tags: [f10]
      summary: Reconcile provider-side execution status through the user's connected account
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Provider execution status reconciled, content: { application/json: { schema: { $ref: "#/components/schemas/F10BundleReconciliation" } } } }
        "409": { description: Reconciliation unavailable; the signed acceptance receipt remains intact }
  /f10/destinations/{id}/revoke:
    post:
      operationId: revokeF10Destination
      tags: [f10]
      summary: Revoke a tenant-scoped destination
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Destination revoked
          content: { application/json: { schema: { $ref: "#/components/schemas/F10Destination" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /f10/releases:
    get:
      operationId: listF10Releases
      tags: [f10]
      responses:
        "200":
          description: Tenant-scoped release list
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/F10Release" } } } }
    post:
      operationId: createF10Release
      tags: [f10]
      summary: Request release of an immutable signed F9 artifact
      description: Artifact bytes are never accepted; F10 retrieves them from OSIRIS custody.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/F10ReleaseRequest" }
      responses:
        "201":
          description: Recorded release intent
          content: { application/json: { schema: { $ref: "#/components/schemas/F10Release" } } }
        "400": { description: Invalid envelope }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /f10/releases/{id}/process:
    post:
      operationId: processF10Release
      tags: [f10]
      summary: Trigger a bounded worker dispatch
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Queued for fenced dispatch }
        "409": { description: Release is not queued }
  /f10/releases/{id}:
    get:
      operationId: getF10Release
      tags: [f10]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Release and append-only transition history
          content: { application/json: { schema: { $ref: "#/components/schemas/F10Release" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Basic liveness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health:
    get:
      operationId: healthDeep
      tags: [health]
      summary: Deep health (db + engines)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeepHealth" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current authenticated user + subscriber
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/usage:
    get:
      operationId: getMyUsage
      tags: [me]
      summary: Token + cost usage for the calling user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/company-spend:
    get:
      operationId: getCompanySpend
      tags: [me]
      summary: Company-wide month-to-date LLM spend vs. the shared monthly cost cap
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySpend" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/company-spend/by-user:
    get:
      operationId: getCompanySpendByUser
      tags: [me]
      summary: Per-staff-member breakdown of the company-wide month-to-date LLM spend
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySpendByUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [me]
      summary: Update the calling user's display name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/export:
    get:
      operationId: exportMyData
      tags: [me]
      summary: Download a JSON bundle of all of the user's account data (GDPR portability)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDataExport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/delete:
    post:
      operationId: deleteMyAccount
      tags: [me]
      summary: Permanently delete the calling user's account and all associated data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountInput" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteAccountResult" }
        "400":
          description: Confirmation phrase missing or incorrect
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessSession" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
    delete:
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Deleted

  /me/context-craft-badges:
    get:
      operationId: listMyContextCraftBadges
      tags: [me]
      summary: List the 7 Context Craft pillar mini-quest badges (earned + locked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContextCraftBadge" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}/ingestion:
    get:
      operationId: getSessionIngestion
      tags: [sessions]
      summary: Get the ingestion record linked to this session (404 if origin=manual)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}:
    get:
      operationId: getIngestion
      tags: [sessions]
      summary: Fetch a previously-ingested document by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionDocument" }
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/{id}/start-session:
    post:
      operationId: startSessionFromIngestion
      tags: [sessions]
      summary: Create a HARNESS session seeded from an ingested document
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestStartSessionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessSession" }
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/feature-state:
    get:
      operationId: listFeatureState
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureState" }

  /sessions/{id}/artifacts:
    get:
      operationId: listSessionArtifacts
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessArtifact" }

  /sessions/{id}/mathmon:
    get:
      operationId: getSessionMathmon
      tags: [harness]
      summary: MATHMON state for a session (intake + MAP + FORGE VERIFIED gate)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MathmonState" }
        "404":
          $ref: "#/components/responses/NotFound"

  /artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "404":
          $ref: "#/components/responses/NotFound"
  /artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: List the caller's owned project artifacts for advisory tools
      responses:
        "200":
          description: Owned artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessArtifact" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /artifacts/{id}/name:
    patch:
      operationId: renameArtifact
      tags: [artifacts]
      summary: Rename an artifact (e.g. name your SPC)
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameArtifactInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessArtifact" }
        "404":
          $ref: "#/components/responses/NotFound"

  /harness/f1:
    post:
      operationId: harnessF1
      tags: [harness]
      summary: ATLAS Prompt Diagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF1Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptDiagnostic" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /magnet/test-kit:
    post:
      operationId: magnetTestKit
      tags: [magnet]
      summary: Anonymous Agent Test Kit — returns a coarse quality band only
      description: >
        Public, pre-auth acquisition magnet. Runs a single lightweight inference
        and returns a quality BAND only (LITE-PASS / LITE-REVIEW / LITE-FAIL).
        The raw numeric score is computed and bucketed server-side and is never
        returned. Rate limited to 5 requests/hour per IP/email. Ephemeral: the
        submitted text is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagnetTestKitInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagnetTestKitResult" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /magnet/calculator:
    post:
      operationId: magnetCalculator
      tags: [magnet]
      summary: Anonymous Savings Calculator — returns a compression-savings range only
      description: >
        Public, pre-auth acquisition magnet. Runs a single lightweight inference
        and returns a compression-savings RANGE (low–high %), never a single
        precise percentage. Signal counts are bucketed into the range
        server-side. Rate limited to 5 requests/hour per IP/email. Ephemeral: the
        submitted text is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagnetCalculatorInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagnetCalculatorResult" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /magnet/conversion:
    post:
      operationId: magnetConversion
      tags: [magnet]
      summary: Record that a magnet visitor clicked through to the front door
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagnetConversionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /harness/f2:
    post:
      operationId: harnessF2
      tags: [harness]
      summary: Atomic Prompt Builder certification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF2Input" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtomicPrompt" }

  /harness/f3:
    post:
      operationId: harnessF3Stream
      tags: [harness]
      summary: CELL MA Builder (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessF3Input" }
      responses:
        "200":
          description: text/event-stream of MA cultivation events
          content:
            text/event-stream:
              schema: { type: string }

  /harness/f4:
    post:
