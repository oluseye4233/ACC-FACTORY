components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Forbidden (tier or role gate)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ── F0 · Business Intelligence Consulting Layer (Domain 23) ──────────────
    F0Service:
      type: string
      enum:
        - PRODUCT_VIABILITY
        - MARKET_VIABILITY
        - CAPI_POSITIONING
        - CUSTOMER_ACQUISITION
        - GO_TO_MARKET
        - FINANCIAL_PROJECTIONS
        - PRODUCT_SYNTHESIS_ADVISORY
        - OFFICER_ANALYSIS
        - COMPETITIVE_TEARDOWN
        - PRICING_STRATEGY
        - BRAND_NARRATIVE
        - INVESTOR_READINESS
        - MATHMON_MAX
        - EVE_MAX

    F0Engagement:
      type: object
      required: [id, userId, title, status, createdAt, updatedAt]
      properties:
        id:        { type: string, format: uuid }
        userId:    { type: string, format: uuid }
        title:     { type: string }
        status:    { type: string, enum: [DISCOVERY, ACTIVE, CLOSED] }
        sessionId:  { type: string, format: uuid, nullable: true }
        artifactId: { type: string, format: uuid, nullable: true }
        discoveryTranscript: { nullable: true }
        challengeResponse:   { nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    F0Report:
      type: object
      required: [id, engagementId, userId, service, reportCode, content, createdAt]
      properties:
        id:           { type: string, format: uuid }
        engagementId: { type: string, format: uuid }
        userId:       { type: string, format: uuid }
        service:      { $ref: "#/components/schemas/F0Service" }
        reportCode:   { type: string }
        sku:          { type: string, nullable: true }
        content:      { type: object, additionalProperties: true }
        accruedCostUsd: { type: string }
        createdAt:    { type: string, format: date-time }

    F0EngagementDetail:
      type: object
      required: [engagement, reports]
      properties:
        engagement: { $ref: "#/components/schemas/F0Engagement" }
        reports:
          type: array
          items: { $ref: "#/components/schemas/F0Report" }

    F0Retainer:
      type: object
      required: [id, userId, title, status, createdAt, updatedAt]
      properties:
        id:        { type: string, format: uuid }
        userId:    { type: string, format: uuid }
        title:     { type: string }
        status:    { type: string, enum: [ACTIVE, PAUSED, ENDED] }
        sessionId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    F0RetainerTask:
      type: object
      required: [id, retainerId, userId, title, detail, status, estCostUsd, createdAt, updatedAt]
      properties:
        id:         { type: string, format: uuid }
        retainerId: { type: string, format: uuid }
        userId:     { type: string, format: uuid }
        title:      { type: string }
        detail:     { type: string }
        status:     { type: string, enum: [PROPOSED, APPROVED, DECLINED, COMPLETED] }
        stage:      { type: string, nullable: true }
        estCostUsd: { type: string }
        createdAt:  { type: string, format: date-time }
        updatedAt:  { type: string, format: date-time }

    F0RetainerDetail:
      type: object
      required: [retainer, tasks]
      properties:
        retainer: { $ref: "#/components/schemas/F0Retainer" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/F0RetainerTask" }

    F0Dashboard:
      type: object
      required: [engagements, retainers, totals, monitoring]
      properties:
        engagements:
          type: array
          items: { $ref: "#/components/schemas/F0Engagement" }
        retainers:
          type: array
          items: { $ref: "#/components/schemas/F0Retainer" }
        totals:
          type: object
          required: [engagementCount, reportCount, accruedReportCostUsd, accruedTaskCostUsd]
          properties:
            engagementCount:      { type: integer }
            reportCount:          { type: integer }
            accruedReportCostUsd: { type: string }
            accruedTaskCostUsd:   { type: string }
        monitoring:
          $ref: "#/components/schemas/F0MonitoringDashboard"

    F0MonitoringDashboard:
      type: object
      required: [lastRunAt, openAlertCount, openAlerts, byRetainer]
      properties:
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          description: Most recent monitoring run across all of the caller's retainers.
        openAlertCount: { type: integer }
        openAlerts:
          type: array
          items: { $ref: "#/components/schemas/F0OpenAlert" }
        byRetainer:
          type: array
          items:
            type: object
            required: [retainerId, lastRunAt]
            properties:
              retainerId: { type: string, format: uuid }
              lastRunAt:  { type: string, format: date-time }

    F0OpenAlert:
      type: object
      required: [id, retainerId, retainerTitle, alertCount, source, ranAt]
      properties:
        id:             { type: string, format: uuid }
        retainerId:     { type: string, format: uuid }
        retainerTitle:  { type: string }
        highestUrgency: { type: string, enum: [WATCH, ACT_SOON, ACT_NOW], nullable: true }
        capiPosture:    { type: string, nullable: true }
        alertCount:     { type: integer }
        source:         { type: string, enum: [manual, cron] }
        ranAt:          { type: string, format: date-time }

    F0MonitoringAck:
      type: object
      required: [id, acknowledgedAt]
      properties:
        id:             { type: string, format: uuid }
        acknowledgedAt: { type: string, format: date-time }

    F0MonitoringSweepResult:
      type: object
      required:
        [ok, retainersConsidered, runsExecuted, breaches, alertsSent, skippedRecent, costCapReached]
      properties:
        ok:                  { type: boolean }
        retainersConsidered: { type: integer }
        runsExecuted:        { type: integer }
        breaches:            { type: integer }
        alertsSent:          { type: integer }
        skippedRecent:       { type: integer }
        costCapReached:      { type: boolean }

    F0Commentary:
      type: object
      required: [stage, read, strengths, watchouts, oneThingToFix]
      properties:
        stage:         { type: string }
        read:          { type: string }
        strengths:     { type: array, items: { type: string } }
        watchouts:     { type: array, items: { type: string } }
        oneThingToFix: { type: string }

    F0Monitoring:
      type: object
      required: [capiPosture, movements, eventAlerts, weeklyCounsel]
      properties:
        capiPosture: { type: string }
        movements:
          type: array
          items:
            type: object
            required: [summary, significance]
            properties:
              summary:      { type: string }
              significance: { type: string, enum: [LOW, MEDIUM, HIGH] }
        eventAlerts:
          type: array
          items:
            type: object
            required: [alert, urgency, recommendedAction]
            properties:
              alert:             { type: string }
              urgency:           { type: string, enum: [WATCH, ACT_SOON, ACT_NOW] }
              recommendedAction: { type: string }
        weeklyCounsel: { type: string }

    CreateF0EngagementInput:
      type: object
      required: [title]
      properties:
        title:      { type: string, minLength: 1, maxLength: 200 }
        sessionId:  { type: string, format: uuid }
        artifactId: { type: string, format: uuid }

    GenerateF0DiscoveryInput:
      type: object
      properties:
        notes:    { type: string, maxLength: 2000 }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    RecordF0DiscoveryInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: object
            required: [id, answer]
            properties:
              id:     { type: string }
              answer: { type: string, maxLength: 4000 }

    GenerateF0ReportInput:
      type: object
      required: [service]
      properties:
        service:  { $ref: "#/components/schemas/F0Service" }
        notes:    { type: string, maxLength: 2000 }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    GenerateF0ChallengeInput:
      type: object
      properties:
        notes:    { type: string, maxLength: 2000 }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    CreateF0RetainerInput:
      type: object
      required: [title]
      properties:
        title:     { type: string, minLength: 1, maxLength: 200 }
        sessionId: { type: string, format: uuid }

    CreateF0RetainerTaskInput:
      type: object
      required: [title]
      properties:
        title:      { type: string, minLength: 1, maxLength: 200 }
        detail:     { type: string, maxLength: 2000 }
        stage:      { type: string, maxLength: 8 }
        estCostUsd: { type: number, minimum: 0 }

    UpdateF0RetainerTaskInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PROPOSED, APPROVED, DECLINED, COMPLETED] }

    GenerateF0CommentaryInput:
      type: object
      required: [stage]
      properties:
        stage:      { type: string, maxLength: 8 }
        sessionId:  { type: string, format: uuid }
        artifactId: { type: string, format: uuid }
        notes:      { type: string, maxLength: 2000 }
        provider:   { $ref: "#/components/schemas/LlmProvider" }

    GenerateF0MonitoringInput:
      type: object
      properties:
        signals:  { type: string, maxLength: 4000 }
        provider: { $ref: "#/components/schemas/LlmProvider" }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    DeepHealth:
      type: object
      required: [status, db, engines]
      properties:
        status: { type: string }
        db: { type: string, enum: [ok, error] }
        engines: { type: string, enum: [ok, degraded, error] }
        version: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    StripeWebhookPayload:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: ["string", "null"] }

    SubscriberTier:
      type: string
      enum: [EXPLORER, PRACTITIONER, ARCHITECT, INSTITUTION]

    CertTier:
      type: string
      enum: [BRONZE, SILVER, GOLD, PLATINUM, NONE]

    FeatureStatus:
      type: string
      enum: [LOCKED, AVAILABLE, IN_PROGRESS, COMPLETE]

    ArtifactType:
      type: string
      enum:
        - PROMPT_DIAGNOSTIC
        - ATOMIC_PROMPT
        - MA_BIRTH_PACKAGE
        - MICRO_PDD
        - SPC
        - ATLAS_PDD
        - ATLAS_PDD_JSON
        - MVP_PDD
        - CODEBASE_BUNDLE
        - PFP_REPORT
        - HOSTING_PLAN

    CodeDjPlatform:
      type: string
      description: Deployment / framework target for the Code DJ scaffold.
      enum:
        - nextjs-vercel
        - react-vite-static
        - express-replit
        - expo-mobile
        - pnpm-monorepo

    CodebaseFile:
      type: object
      required: [path, language, content]
      properties:
        path:     { type: string, description: "Project-root-relative path, e.g. src/index.ts" }
        language: { type: string, description: "ISO-ish language hint, e.g. typescript, json, md, env" }
        content:  { type: string }

    CodebaseManifest:
      type: object
      required: [framework, language, entrypoint, installCommand, runCommand, deployTarget]
      properties:
        framework:      { type: string }
        language:       { type: string }
        entrypoint:     { type: string }
        installCommand: { type: string }
        runCommand:     { type: string }
        buildCommand:   { type: ["string", "null"] }
        deployTarget:   { type: string }

    HarnessF8Input:
      type: object
      required: [sessionId, mvpPddArtifactId, platform]
      properties:
        sessionId:        { type: string, format: uuid }
        mvpPddArtifactId: { type: string, format: uuid }
        platform:         { $ref: "#/components/schemas/CodeDjPlatform" }
        notes:
          type: string
          description: Optional operator hints for the Code DJ (preferred libs, naming, etc.).
          maxLength: 2000
        acknowledgeDrift:
          type: boolean
          description: Override the PFP drift gate. Required when the most recent PFP report for the same MVP PDD has any critical findings.
        provider: { $ref: "#/components/schemas/LlmProvider" }

    HostPlatform:
      type: string
      description: Closed registry of deployment hosts the Host DJ ranks. "replit-deployments" is the HARNESS-certified default.
      enum:
        - replit-deployments
        - vercel
        - fly-io
        - render
        - railway
        - cloudflare-pages
        - netlify
        - aws-amplify
        - expo-eas

    HarnessF8HdjInput:
      type: object
      required: [sessionId, mvpPddArtifactId]
      properties:
        sessionId:        { type: string, format: uuid }
        mvpPddArtifactId: { type: string, format: uuid }
        codebaseBundleArtifactId:
          type: string
          format: uuid
          description: Optional F8 codebase bundle to sharpen the hosting requirements profile.
        notes:
          type: string
          description: Optional operator hints for the Host DJ (preferred host, region/compliance constraints, budget ceiling).
          maxLength: 2000
        provider: { $ref: "#/components/schemas/LlmProvider" }

    HostingRequirementsProfile:
      type: object
      required: [runtime, deployTarget, database, regions, compliance, scaleProfile, summary]
      properties:
        runtime:      { type: string, description: "e.g. node, python, static, mobile" }
        deployTarget: { type: string, description: "Surface implied by the PDD, e.g. web-service, static-site, mobile-app" }
        database:     { type: string, description: "DB need, e.g. postgres, none, sqlite, managed-kv" }
        regions:
          type: array
          items: { type: string }
        compliance:
          type: array
          items: { type: string }
        scaleProfile: { type: string, enum: [prototype, low, medium, high] }
        summary:      { type: string }

    HseWeights:
      type: object
      required: [stackCompat, cost, deploySimplicity, dbFit, cicd, compliance, scalability, lockin]
      description: Fixed Host-Selection-Engine criterion weights (sum 100), recomputed server-side.
      properties:
        stackCompat:      { type: integer }
        cost:             { type: integer }
        deploySimplicity: { type: integer }
        dbFit:            { type: integer }
        cicd:             { type: integer }
        compliance:       { type: integer }
        scalability:      { type: integer }
        lockin:           { type: integer }

    HseScores:
      type: object
      required: [stackCompat, cost, deploySimplicity, dbFit, cicd, compliance, scalability, lockin]
      description: Per-criterion 0..10 scores. "lockin" is scored 10 = no vendor lock-in.
      properties:
        stackCompat:      { type: number }
        cost:             { type: number }
        deploySimplicity: { type: number }
        dbFit:            { type: number }
        cicd:             { type: number }
        compliance:       { type: number }
        scalability:      { type: number }
        lockin:           { type: number }

    HseRow:
      type: object
      required: [platform, scores, weightedTotal]
      properties:
        platform:      { $ref: "#/components/schemas/HostPlatform" }
        scores:        { $ref: "#/components/schemas/HseScores" }
        weightedTotal: { type: number, description: "0..100, recomputed server-side from scores × weights." }

    HostPick:
      type: object
      required: [platform, score, rationale]
      properties:
        platform:  { $ref: "#/components/schemas/HostPlatform" }
        score:     { type: number }
        rationale: { type: string }

    DeploymentJourneyPhase:
      type: object
      required: [name, detail]
      properties:
        name:   { type: string }
        detail: { type: string }

    EnvTemplateEntry:
      type: object
      required: [key, description, required]
      properties:
        key:         { type: string, description: "Env var NAME only — never a value." }
        description: { type: string }
        required:    { type: boolean }

    SelfDeployFactory:
      type: object
      required: [envTemplate, ciYaml, healthCheck, rollback]
      properties:
        envTemplate:
          type: array
          items: { $ref: "#/components/schemas/EnvTemplateEntry" }
        ciYaml:      { type: string, description: "CI/CD pipeline YAML (advisory; contains no secrets)." }
        healthCheck: { type: string }
        rollback:    { type: string }

    HostingPlan:
      type: object
      required: [artifactId, hrp, weights, hse, primary, fallback, journey, sdf, jcse]
      properties:
        artifactId: { type: string, format: uuid }
        hrp:        { $ref: "#/components/schemas/HostingRequirementsProfile" }
        weights:    { $ref: "#/components/schemas/HseWeights" }
        hse:
          type: array
          description: Candidate hosts ranked desc by weightedTotal.
          items: { $ref: "#/components/schemas/HseRow" }
        primary:    { $ref: "#/components/schemas/HostPick" }
        fallback:   { $ref: "#/components/schemas/HostPick" }
        journey:
          type: object
          required: [tier, phases]
          properties:
            tier: { type: string, description: "Recommended deployment tier on the primary host." }
            phases:
              type: array
              items: { $ref: "#/components/schemas/DeploymentJourneyPhase" }
        sdf:  { $ref: "#/components/schemas/SelfDeployFactory" }
        jcse: { type: number, description: "Journey Confidence / Self-deploy Estimate 0..100, derived server-side from the winning weighted score." }
        notes: { type: string }

    HarnessAtlasCrystalliseInput:
      type: object
      required: [sessionId, atlasPddArtifactId]
      properties:
        sessionId:           { type: string, format: uuid }
        atlasPddArtifactId:  { type: string, format: uuid }
        provider:            { $ref: "#/components/schemas/LlmProvider" }

    AtlasPddJsonPhase:
      type: string
      enum: [RED, ORANGE, YELLOW, GREEN, BLUE, INDIGO, VIOLET, WHITE]

    AtlasPddJsonPrompt:
      type: object
      required: [id, phase, title, operation, classification, dependencies, sourceSection]
      properties:
        id:             { type: string, description: "Stable id of the form P-<PHASE>-<NNN>" }
        phase:          { $ref: "#/components/schemas/AtlasPddJsonPhase" }
        title:          { type: string }
        operation:      { type: string }
        classification: { type: string, enum: [A, B, C] }
        dependencies:
          type: array
          items: { type: string }
        sourceSection:
          type: string
          enum: [cheatSheet, execSummary, worksheet, implementation]

    AtlasPddJson:
      type: object
      required: [artifactId, schemaVersion, title, summary, prompts, stack, routes, deployTarget]
      properties:
        artifactId:    { type: string, format: uuid }
        schemaVersion: { type: string, enum: ["atlas-pdd-v1"] }
        title:         { type: string }
        summary:       { type: string }
        prompts:
          type: array
          items: { $ref: "#/components/schemas/AtlasPddJsonPrompt" }
        stack:
          type: array
          items: { type: string }
        routes:
          type: array
          items: { type: string }
        deployTarget:  { type: string }

    HarnessPfpInput:
      type: object
      required: [sessionId, mvpPddArtifactId, codebaseBundleArtifactId]
      properties:
        sessionId:                { type: string, format: uuid }
        mvpPddArtifactId:         { type: string, format: uuid }
        codebaseBundleArtifactId: { type: string, format: uuid }
        provider:                 { $ref: "#/components/schemas/LlmProvider" }

    PfpFindingCode:
      type: string
      enum:
        - SPEC_DRIFT
        - PDD_ORPHAN
        - UNAUTHORIZED_EXTENSION
        - CIRCULAR_DEPENDENCY
        - SEMANTIC_DRIFT
        - OVER_SPECIFICATION
        - AMBIGUOUS_OUTPUT

    PfpFindingSeverity:
      type: string
      enum: [critical, high, medium, low]

    PfpFinding:
      type: object
      required: [code, severity, pddRef, codeRef, detail]
      properties:
        code:     { $ref: "#/components/schemas/PfpFindingCode" }
        severity: { $ref: "#/components/schemas/PfpFindingSeverity" }
        pddRef:   { type: string }
        codeRef:  { type: string }
        detail:   { type: string }

    PfpReport:
      type: object
      required: [artifactId, verdict, fci, summary, findings, counts]
      properties:
        artifactId: { type: string, format: uuid }
        f0ReportCode:
          type: ["string", "null"]
          description: F0 advisory report code assigned at report-generation time, formatted [CODE]-[SKU]-[TIMESTAMP] and anchored to the owning MVP PDD's SKU. Null when the source MVP PDD has no SKU yet.
        verdict:    { type: string, enum: [pass, pass_with_notes, fail] }
        fci:        { type: integer, minimum: 0, maximum: 100 }
        summary:    { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/PfpFinding" }
        counts:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical: { type: integer }
            high:     { type: integer }
            medium:   { type: integer }
            low:      { type: integer }

    CodebaseBundle:
      type: object
      required: [artifactId, platform, manifest, files, notes]
      properties:
        artifactId: { type: string, format: uuid }
        platform:   { $ref: "#/components/schemas/CodeDjPlatform" }
        manifest:   { $ref: "#/components/schemas/CodebaseManifest" }
        files:
          type: array
          items: { $ref: "#/components/schemas/CodebaseFile" }
        notes:      { type: string }

    Subscriber:
      type: object
      required: [tier, status]
      properties:
        tier: { $ref: "#/components/schemas/SubscriberTier" }
        status: { type: string }
        currentPeriodEnd: { type: ["string", "null"], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        usage:
          type: object
          required: [f1, f2, f3, f4, f5, f6, f7, f8]
          properties:
            f1: { type: integer }
            f2: { type: integer }
            f3: { type: integer }
            f4: { type: integer }
            f5: { type: integer }
            f6: { type: integer }
            f7: { type: integer }
            f8: { type: integer }

    MeResponse:
      type: object
      required: [id, clerkUserId, role, subscriber]
      properties:
        id: { type: string, format: uuid }
        clerkUserId: { type: string }
        email: { type: ["string", "null"] }
        displayName: { type: ["string", "null"] }
        role: { type: string }
        subscriber: { $ref: "#/components/schemas/Subscriber" }

    UsageWindow:
      type: object
      required: [totalTokens, totalCostUsd]
      properties:
        totalTokens: { type: integer }
        totalCostUsd: { type: number }

    UsageByEngine:
      type: object
      required: [engineId, runs, totalTokens, totalCostUsd]
      properties:
        engineId: { type: integer }
        runs: { type: integer }
        totalTokens: { type: integer }
        totalCostUsd: { type: number }

    UsageReport:
      type: object
      required: [day, month, byEngine]
      properties:
        day: { $ref: "#/components/schemas/UsageWindow" }
        month: { $ref: "#/components/schemas/UsageWindow" }
        byEngine:
          type: array
          items: { $ref: "#/components/schemas/UsageByEngine" }

    UpdateProfileInput:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }

    DeleteAccountInput:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must be exactly "DELETE" to proceed.

    DeleteAccountResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        deletedAt: { type: string, format: date-time }

    MyDataExport:
      type: object
      required: [exportedAt, user, subscriber, sessions, artifacts, badges, engineRunCount]
      properties:
        exportedAt: { type: string, format: date-time }
        user:
          type: object
          additionalProperties: true
        subscriber:
          type: object
          additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: true
        badges:
          type: array
          items:
            type: object
            additionalProperties: true
        engineRunCount: { type: integer }

    LlmProvider:
      type: string
      enum: [claude, openai, gemini]
      description: |
