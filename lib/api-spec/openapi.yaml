          $ref: "#/components/responses/NotFound"

  /f0/engagements/{id}/discovery/generate:
    post:
      operationId: generateF0Discovery
      tags: [f0]
      summary: SOCRATES — generate the 7-question discovery session for an engagement
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateF0DiscoveryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F0Engagement" }
        "402":
          description: Company-wide monthly LLM cost cap reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

  /f0/engagements/{id}/discovery:
    put:
      operationId: recordF0Discovery
      tags: [f0]
      summary: Record the operator's answers to the SOCRATES discovery questions
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordF0DiscoveryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/F0Engagement" }
        "404":
          $ref: "#/components/responses/NotFound"

  /f0/engagements/{id}/reports:
    post:
      operationId: generateF0Report
      tags: [f0]
      summary: Generate a 9-SPC ensemble advisory report (SSE stream)
      description: >-
        Streams the ensemble report for one service. Requires the discovery
        transcript to be recorded first. Emits SSE events; the final `complete`
        event carries the persisted report including its report code, SOLVA bear
        case, range-based financials, and the non-suppressible Honesty Gate.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateF0ReportInput" }
      responses:
        "200":
          description: text/event-stream of report progress and the final report
          content:
            text/event-stream:
              schema: { type: string }
        "402":
          description: Company-wide monthly LLM cost cap reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Discovery transcript not yet recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

