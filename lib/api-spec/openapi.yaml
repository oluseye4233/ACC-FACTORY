        platform: { $ref: "#/components/schemas/CodeDjPlatform" }
        artifactClass:
          type: string
          enum: [SOFTWARE, FIRMWARE]
          description: Selects whether the F8 bundle continues through F9 (firmware) or goes directly to F10/F11 (software).
