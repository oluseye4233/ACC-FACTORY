        mm_verdict: { type: string, enum: [MATH_VERIFIED] }
        ucg_certificate: { type: object, additionalProperties: true }
        savant_verdict: { type: string, enum: [FIT, CLUSTER, N/A] }
        osiris_custody: { type: boolean, enum: [true] }
        reverification_due: { type: string, format: date-time }
        payload_hash: { type: string, description: SHA-256 hash of canonical immutable payload }
        artifact_signature: { type: string, description: HMAC signature; signing key is never returned }
        regulatory_conformity_asserted: { type: boolean, enum: [false] }
        evidence: { type: object, additionalProperties: true }

    F9RunRecord:
      type: object
      properties:
