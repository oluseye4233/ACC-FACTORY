name: Nightly cross-provider engine checks

on:
  schedule:
    # 07:00 UTC every day (after most provider rate-limit windows reset).
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-cross-provider
  cancel-in-progress: false

jobs:
  live-providers:
    name: Engines × live providers (RECORD=1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workspace_test
      NODE_ENV: test
      # Live provider credentials — the nightly job runs the test suite with
      # RECORD=1 so it actually issues calls to each SDK, rewrites the cached
      # fixtures in artifacts/api-server/test/__fixtures__/llm/<provider>/ and
      # surfaces any drift as a workflow artifact + GitHub issue.
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: ${{ secrets.AI_INTEGRATIONS_ANTHROPIC_BASE_URL }}
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: ${{ secrets.AI_INTEGRATIONS_ANTHROPIC_API_KEY }}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
      AI_INTEGRATIONS_GEMINI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_GEMINI_BASE_URL }}
      AI_INTEGRATIONS_GEMINI_API_KEY: ${{ secrets.AI_INTEGRATIONS_GEMINI_API_KEY }}
      FIXTURES_PATH: artifacts/api-server/test/__fixtures__/llm

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push-force

      - name: Verify provider credentials are present
        run: |
          missing=0
          for var in \
            AI_INTEGRATIONS_ANTHROPIC_BASE_URL AI_INTEGRATIONS_ANTHROPIC_API_KEY \
            AI_INTEGRATIONS_OPENAI_BASE_URL    AI_INTEGRATIONS_OPENAI_API_KEY \
            AI_INTEGRATIONS_GEMINI_BASE_URL    AI_INTEGRATIONS_GEMINI_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::missing secret: $var"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::error::Configure AI_INTEGRATIONS_* secrets in the repository / environment before this job will exercise live providers."
            exit 1
          fi

      - name: Test (live providers, RECORD=1)
        id: test_live
        run: |
          mkdir -p .nightly-out
          # Run vitest directly so we can attach the JSON reporter alongside
          # the default reporter. The JSON file lets the downstream
          # "Detect regressed providers" step name the exact provider(s) that
          # regressed instead of listing every configured provider.
          RECORD=1 pnpm --filter @workspace/api-server exec vitest run \
            --reporter=default \
            --reporter=json \
            --outputFile.json=.nightly-out/vitest.json

      - name: Detect fixture drift
        id: drift
        if: always() && steps.test_live.outcome == 'success'
        run: |
          set -e
          if git diff --quiet -- "$FIXTURES_PATH"; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "No fixture drift detected — replay cache is still byte-identical to live provider responses."
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "Fixture drift detected:"
            git diff --stat -- "$FIXTURES_PATH"
            mkdir -p .nightly-out
            git diff -- "$FIXTURES_PATH" > .nightly-out/fixtures.diff
            git status --porcelain -- "$FIXTURES_PATH" > .nightly-out/fixtures.status
          fi

      - name: Upload drifted fixtures
        if: always() && steps.drift.outputs.drifted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: llm-fixtures-${{ github.run_id }}
          path: |
            artifacts/api-server/test/__fixtures__/llm/**
            .nightly-out/fixtures.diff
            .nightly-out/fixtures.status
          if-no-files-found: error
          retention-days: 30

      - name: Open issue on fixture drift
        if: always() && steps.drift.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly LLM fixture drift detected (${context.runId})`;
            const body = [
              `The nightly \`RECORD=1\` run produced cached LLM fixtures that differ from the committed copies.`,
              ``,
              `This means at least one provider's response shape — or one of our engine prompts — has changed since the fixtures were last captured.`,
              ``,
              `**Next steps:**`,
              `1. Download the \`llm-fixtures-${context.runId}\` artifact from the run below.`,
              `2. Inspect \`fixtures.diff\` to see which provider / engine drifted.`,
              `3. If the new responses are acceptable, replace \`artifacts/api-server/test/__fixtures__/llm/\` with the artifact contents and open a PR.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Triggered by: ${context.eventName}`,
              `Commit: ${context.sha}`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ci", "cross-provider", "nightly", "fixture-drift"],
            });

      - name: Detect regressed providers
        if: failure()
        id: regressed
        run: |
          # Preferred path: parse the vitest JSON reporter output and pick out
          # the providers whose tests actually failed. Every test in the
          # provider-switching suites is named "<provider>: ...", so a failed
          # test's `fullName` / `name` starts with `claude:`, `openai:`, or
          # `gemini:`. The engine label (F2, F4, F6-VDJ, F8 Code DJ, DE-SPC,
          # ...) follows immediately after the provider prefix, so we can pull
          # both out in one pass and surface (provider, engine) pairs to the
          # chat ping. Map `claude` -> `anthropic` to match the env-var
          # provider names used in the fallback / chat message.
          report=.nightly-out/vitest.json
          regressed=""
          pairs=""
          parsed=0
          if [ -f "$report" ] && jq -e . "$report" >/dev/null 2>&1; then
            failed_names="$(
              jq -r '
                [ ..
                  | objects
                  | select((.status? // empty) == "failed")
                  | (.fullName? // .name? // empty)
                ]
                | map(select(type == "string"))
                | map(select(test("^(claude|openai|gemini):"; "i")))
                | .[]
              ' "$report" 2>/dev/null || true
            )"
            if [ -n "$failed_names" ]; then
              regressed="$(
                printf '%s\n' "$failed_names" \
                  | jq -R -s -r '
                    split("\n")
                    | map(select(length > 0))
                    | map(capture("^(?<p>claude|openai|gemini):"; "i").p)
                    | map(ascii_downcase)
                    | map(if . == "claude" then "anthropic" else . end)
                    | unique
                    | join(",")
                  '
              )"
              # `capture` throws on non-matching strings, so filter to
              # provider-prefixed names that also carry a known engine
              # label first. Names like "<provider>: returns 200 ..."
              # (the generic F1 smoke test) deliberately fall through —
              # they'll still be counted in the provider list above so
              # the chat ping stays actionable.
              pairs="$(
                printf '%s\n' "$failed_names" \
                  | jq -R -s -r '
                    split("\n")
                    | map(select(length > 0))
                    | map(select(test("^(claude|openai|gemini):\\s+(DE-SPC|F[0-9]+-VDJ|F[0-9]+ Code DJ|F[0-9]+)"; "i")))
                    | map(capture("^(?<p>claude|openai|gemini):\\s+(?<e>DE-SPC|F[0-9]+-VDJ|F[0-9]+ Code DJ|F[0-9]+)"; "i"))
                    | map(.p |= ascii_downcase | .p |= (if . == "claude" then "anthropic" else . end))
                    | group_by(.p)
                    | map({ p: .[0].p, engines: (map(.e) | unique) })
                    | sort_by(.p)
                    | map("\(.p): \(.engines | join(", "))")
                    | join("; ")
                  ' 2>/dev/null || true
              )"
              if [ -z "$pairs" ] && [ -n "$failed_names" ]; then
                echo "::warning::Provider failures had no parseable engine labels — falling back to provider-only notification."
              fi
            fi
            parsed=1
          fi
          if [ -n "$pairs" ]; then
            echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
            echo "Regressed (provider, engine) pairs parsed from vitest report: $pairs"
          fi
          if [ -n "$regressed" ]; then
            echo "providers=$regressed" >> "$GITHUB_OUTPUT"
            echo "Regressed providers parsed from vitest report: $regressed"
            exit 0
          fi
          # Fallback: if the JSON report is missing, unparseable, or contained
          # no provider-prefixed failures (e.g. the suite blew up before any
          # provider test ran), list every provider whose credentials were
          # configured for this run so the chat ping is still actionable.
          if [ "$parsed" = "1" ]; then
            echo "::warning::vitest JSON report parsed but no provider-prefixed failures found — falling back to configured-provider list."
          else
            echo "::warning::vitest JSON report missing or unreadable at $report — falling back to configured-provider list."
          fi
          providers=()
          [ -n "$AI_INTEGRATIONS_ANTHROPIC_API_KEY" ] && providers+=("anthropic")
          [ -n "$AI_INTEGRATIONS_OPENAI_API_KEY" ]    && providers+=("openai")
          [ -n "$AI_INTEGRATIONS_GEMINI_API_KEY" ]    && providers+=("gemini")
          if [ ${#providers[@]} -eq 0 ]; then
            list="unknown (no provider credentials were configured)"
          else
            list="$(IFS=, ; echo "${providers[*]}")"
          fi
          echo "providers=$list" >> "$GITHUB_OUTPUT"

      - name: Notify on failure (GitHub issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const providers = `${{ steps.regressed.outputs.providers }}`;
            const pairs = `${{ steps.regressed.outputs.pairs }}`;
            const title = `Nightly cross-provider engine checks failed (${context.runId})`;
            const lines = [
              `The nightly job exercising HARNESS engines against live providers failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Triggered by: ${context.eventName}`,
              `Commit: ${context.sha}`,
              `Regressed providers: ${providers}`,
            ];
            if (pairs) {
              lines.push(`Failed (provider, engine) pairs: ${pairs}`);
            }
            const body = lines.join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ci", "cross-provider", "nightly"],
            });

      - name: Notify on failure (Slack webhook)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.NIGHTLY_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          PROVIDERS: ${{ steps.regressed.outputs.providers }}
          PAIRS: ${{ steps.regressed.outputs.pairs }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "NIGHTLY_SLACK_WEBHOOK_URL not configured — skipping Slack notification."
            exit 0
          fi
          short_sha="${COMMIT_SHA:0:7}"
          text=":rotating_light: Nightly cross-provider engine checks failed
*Run:* ${RUN_URL}
*Commit:* ${short_sha}
*Regressed providers:* ${PROVIDERS}"
          if [ -n "$PAIRS" ]; then
            text="${text}
*Failed (provider, engine) pairs:* ${PAIRS}"
          fi
          payload=$(jq -nc --arg text "$text" '{text: $text}')
          # Slack and Discord both accept a `text` field on their incoming
          # webhooks, so the same payload works for either destination.
          http_status=$(curl --silent --show-error --output /tmp/notify-body \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL" || echo "000")
          echo "Chat webhook responded HTTP $http_status"
          if [ "$http_status" != "200" ] && [ "$http_status" != "204" ]; then
            echo "::warning::Chat notification webhook returned HTTP $http_status"
            cat /tmp/notify-body || true
          fi
