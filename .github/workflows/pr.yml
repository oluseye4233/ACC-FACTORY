name: PR checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & tests (cached replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workspace_test
      NODE_ENV: test
      # Cross-provider engine tests skip cleanly when these are absent. The PR
      # job intentionally leaves them unset so live LLM calls only happen in the
      # nightly job (see nightly-cross-provider.yml). Once the fixture-cache
      # follow-up lands, this is where cached replay mode will be enabled.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push -- --force || pnpm --filter @workspace/db run push-force
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Regenerate API client/zod from OpenAPI
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Verify generated API artifacts are committed
        run: |
          if ! git diff --exit-code -- lib/api-zod lib/api-client-react; then
            echo ""
            echo "::error::OpenAPI-derived artifacts are out of date."
            echo "Run 'pnpm --filter @workspace/api-spec run codegen' locally and commit the changes in lib/api-zod and lib/api-client-react."
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
